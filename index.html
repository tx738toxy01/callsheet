          <div>
            <label class="block text-xs font-bold text-zinc-400 mb-1">Hlavná lokácia (areál / kde parkujeme)</label>
            <input id="wizardMainLoc" type="text" placeholder="Napr. Hlavný areál" class="w-full rounded-xl bg-zinc-100 dark:bg-zinc-800 border border-zinc-200 dark:border-zinc-700 px-3.5 py-2 text-xs sm:text-sm focus:outline-none focus:border-amber-500" />
          </div>
        </div>
      `;

      document.getElementById('modalFooter').innerHTML = `
        <button onclick="closeModal()" class="px-4 py-2 rounded-xl bg-zinc-200 dark:bg-zinc-800 text-xs font-bold">Zrušiť</button>
        <button onclick="createBlankEpisode()" class="px-5 py-2 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-zinc-950 text-xs font-extrabold">Vytvoriť</button>
      `;

      showModalOverlay();
    }

    function createBlankEpisode() {
      const nameInput = document.getElementById('wizardEpName').value.trim();
      const mainLocInput = document.getElementById('wizardMainLoc').value.trim();

      if (!nameInput) {
        alert('Zadajte názov projektu alebo časti.');
        return;
      }

      const mainComplex = mainLocInput || `Areál: ${nameInput}`;
      const baseId = nameInput.replace(/\s+/g, '_');
      const starterItems = [];

      if (mainLocInput) {
        starterItems.push({
          id: `${baseId}_init_1`,
          category: 'LOKÁCIA (EXT./INT.)',
          group: 'LOCATIONS',
          mainLocation: mainComplex,
          title: mainLocInput,
          scenesRaw: '1/1',
          locationOrEp: 'EXT. / INT.',
          details: '',
          userNotes: '',
          checked: false
        });
      }

      appState.projects[nameInput] = {
        name: nameInput,
        col4Header: 'TYP / LOKALITA',
        items: starterItems,
        sceneDone: {}
      };

      appState.activeProject = nameInput;
      appState.activeTab = 'HOME';
      appState.episodeFilter = 'ALL';
      saveState();
      closeModal();
      syncHistoryPush();
      renderApp();
    }

    function openAddItemModal(preselectedCategory = 'ÚČINKUJÚCI', prefilledMainLocation = '') {
      const project = getCurrentProject();
      const returnToMainLoc = prefilledMainLocation || '';

      document.getElementById('modalTitleWrap').innerHTML = `
        <span class="text-[11px] font-bold uppercase tracking-wider text-amber-600 dark:text-amber-400 block">${escapeHtml(project.name)}</span>
        <h2 class="font-extrabold text-base sm:text-lg">${returnToMainLoc ? `Pridať podlokáciu do: ${escapeHtml(returnToMainLoc)}` : 'Pridať položku'}</h2>
      `;

      const categories = [
        { val: 'ÚČINKUJÚCI', label: 'Účinkujúci (Herci, Moderátori, Hostia)' },
        { val: 'LOKÁCIA (INT.)', label: 'Lokácia – Interiér (miestnosť / priestor)' },
        { val: 'LOKÁCIA (EXT.)', label: 'Lokácia – Exteriér' },
        { val: 'GASTRO', label: 'Gastro (Suroviny, Jedlo, Hostina)' },
        { val: 'KOSTÝMY', label: 'Kostýmy (Oblečenie a prezleky)' },
        { val: 'REKVIZITY', label: 'Rekvizity & Technika' }
      ];

      const defaultMainLoc = prefilledMainLocation || `Areál: ${project.name}`;

      document.getElementById('modalBody').innerHTML = `
        <div class="space-y-3">
          <div>
            <label class="block text-xs font-bold text-zinc-400 mb-1">Kategória</label>
            <select id="newCat" onchange="toggleNewItemMainLocField(this.value)" class="w-full rounded-xl bg-zinc-100 dark:bg-zinc-800 border border-zinc-200 dark:border-zinc-700 px-3 py-2.5 text-sm font-bold">
              ${categories.map(c => `<option value="${c.val}" ${c.val === preselectedCategory ? 'selected' : ''}>${c.label}</option>`).join('')}
            </select>
          </div>

          <div id="newMainLocWrap" class="${preselectedCategory.includes('LOKÁCIA') ? '' : 'hidden'}">
            <label class="block text-xs font-bold text-emerald-600 dark:text-emerald-400 mb-1">Hlavná lokácia (Areál / Kde parkujeme)</label>
            <input id="newMainLoc" type="text" value="${escapeHtml(defaultMainLoc)}" placeholder="Napr. Hlavný areál" class="w-full rounded-xl bg-emerald-500/10 border border-emerald-500/30 px-3 py-2 text-xs sm:text-sm font-semibold" />
          </div>

          <div>
            <label class="block text-xs font-bold text-zinc-400 mb-1">Názov položky / Meno / Podlokácia *</label>
            <input id="newTitle" type="text" placeholder="${returnToMainLoc ? 'Napr. Kráľovská spálňa / Kuchyňa...' : 'Napr. Historik / Kráľovská sála / Pečený bažant...'}" class="w-full rounded-xl bg-zinc-100 dark:bg-zinc-800 border border-zinc-200 dark:border-zinc-700 px-3 py-2.5 text-sm" />
          </div>

          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-xs font-bold text-zinc-400 mb-1">Obrazy (nepovinné)</label>
              <input id="newScenes" type="text" placeholder="Napr. 4/1, 8/1" class="w-full rounded-xl bg-zinc-100 dark:bg-zinc-800 border border-zinc-200 dark:border-zinc-700 px-3 py-2 text-sm" />
            </div>
            <div>
              <label class="block text-xs font-bold text-zinc-400 mb-1">${escapeHtml(project.col4Header)}</label>
              <input id="newLoc" type="text" value="${returnToMainLoc ? 'INT.' : escapeHtml(project.name)}" placeholder="Napr. INT. / ${escapeHtml(project.name)}" class="w-full rounded-xl bg-zinc-100 dark:bg-zinc-800 border border-zinc-200 dark:border-zinc-700 px-3 py-2 text-sm" />
            </div>
          </div>

          <div>
            <label class="block text-xs font-bold text-zinc-400 mb-1">Detaily a produkčné poznámky</label>
            <textarea id="newDetails" rows="3" placeholder="Podrobnosti, kostýmy vo formáte 1) Názov (obrazy), 2) Názov (obrazy)..." class="w-full rounded-xl bg-zinc-100 dark:bg-zinc-800 border border-zinc-200 dark:border-zinc-700 p-3 text-sm"></textarea>
          </div>
        </div>
      `;

      document.getElementById('modalFooter').innerHTML = `
        <button onclick="${returnToMainLoc ? `openMainLocationModal('${escapeHtml(returnToMainLoc)}', false)` : 'closeModal()'}" class="px-4 py-2 rounded-xl bg-zinc-200 dark:bg-zinc-800 text-xs font-bold">Zrušiť</button>
        <div class="flex items-center gap-2">
          <button onclick="createNewItem(true, '${escapeHtml(returnToMainLoc)}')" class="px-3.5 py-2 rounded-xl bg-zinc-200 dark:bg-zinc-800 hover:bg-zinc-300 text-xs font-bold">+ Uložiť a ďalšiu</button>
          <button onclick="createNewItem(false, '${escapeHtml(returnToMainLoc)}')" class="px-4 py-2 rounded-xl bg-amber-500 text-zinc-950 text-xs font-extrabold">Uložiť</button>
        </div>
      `;

      showModalOverlay();
      setTimeout(() => document.getElementById('newTitle')?.focus(), 50);
    }

    function toggleNewItemMainLocField(val) {
      const wrap = document.getElementById('newMainLocWrap');
      if (!wrap) return;
      if (val.includes('LOKÁCIA')) wrap.classList.remove('hidden');
      else wrap.classList.add('hidden');
    }

    function createNewItem(keepOpen = false, returnToMainLoc = '') {
      const project = getCurrentProject();
      const rawCat = document.getElementById('newCat').value.trim();
      const title = document.getElementById('newTitle').value.trim();
      const scenesRaw = document.getElementById('newScenes').value.trim();
      const locationOrEp = document.getElementById('newLoc').value.trim();
      const details = document.getElementById('newDetails').value.trim();
      const mainLocEl = document.getElementById('newMainLoc');
      const { group, cleanCategory } = normalizeCategoryAndGroup(rawCat, title, details);

      if (!title) {
        alert('Zadajte názov položky.');
        return;
      }

      const mainLocation = group === 'LOCATIONS'
        ? ((mainLocEl && mainLocEl.value.trim()) || inferMainLocation(title, locationOrEp, project.name))
        : '';

      project.items.push({
        id: `${project.name.replace(/\s+/g, '_')}_custom_${Date.now()}_${Math.random().toString(36).slice(2,5)}`,
        category: cleanCategory,
        group,
        mainLocation,
        title,
        scenesRaw,
        locationOrEp,
        details,
        userNotes: '',
        checked: false
      });

      saveState();
      renderApp();

      if (keepOpen) {
        document.getElementById('newTitle').value = '';
        document.getElementById('newScenes').value = '';
        document.getElementById('newDetails').value = '';
        document.getElementById('newTitle').focus();
      } else if (returnToMainLoc) {
        openMainLocationModal(returnToMainLoc, false);
      } else {
        closeModal();
      }
    }

    // =========================================================================
    // 18. UTILITY ACTIONS
    // =========================================================================
    function showModalOverlay() {
      const ov = document.getElementById('modalOverlay');
      ov.classList.remove('hidden');
      ov.classList.add('flex');
      document.body.style.overflow = 'hidden';
    }

    function closeModalUIOnly() {
      const ov = document.getElementById('modalOverlay');
      ov.classList.add('hidden');
      ov.classList.remove('flex');
      document.body.style.overflow = '';
    }

    function closeModal() {
      closeModalUIOnly();
      modalStack = [];
      syncHistoryPush();
    }

    function handleOverlayClick(e) {
      if (e.target.id === 'modalOverlay') closeModal();
    }

    function updateModalBackBtn() {
      const btn = document.getElementById('modalBackBtn');
      if (modalStack.length > 1) btn.classList.remove('hidden');
      else btn.classList.add('hidden');
    }

    function toggleItemCheck(e, itemId) {
      e.stopPropagation();
      const project = getCurrentProject();
      const item = project.items.find(i => i.id === itemId);
      if (item) {
        item.checked = !item.checked;
        saveState();
        renderApp();
      }
    }

    function toggleItemCheckInModal(itemId) {
      const project = getCurrentProject();
      const item = project.items.find(i => i.id === itemId);
      if (item) {
        item.checked = !item.checked;
        saveState();
        renderApp();
        openItemModal(itemId, false);
      }
    }

    function toggleSceneDone(e, sceneCode) {
      e.stopPropagation();
      const project = getCurrentProject();
      if (!project.sceneDone) project.sceneDone = {};
      project.sceneDone[sceneCode] = !project.sceneDone[sceneCode];
      saveState();
      renderApp();
    }

    function toggleSceneDoneInModal(sceneCode) {
      const project = getCurrentProject();
      if (!project.sceneDone) project.sceneDone = {};
      project.sceneDone[sceneCode] = !project.sceneDone[sceneCode];
      saveState();
      renderApp();
      openSceneModal(sceneCode, false);
    }

    function saveUserNote(itemId, val) {
      const project = getCurrentProject();
      const item = project.items.find(i => i.id === itemId);
      if (item) {
        item.userNotes = val;
        saveState();
        renderApp();
      }
    }

    function saveItemEdits(itemId) {
      const project = getCurrentProject();
      const item = project.items.find(i => i.id === itemId);
      if (!item) return;
      item.title = document.getElementById('editTitle').value.trim();
      item.scenesRaw = document.getElementById('editScenes').value.trim();
      item.locationOrEp = document.getElementById('editLoc').value.trim();
      item.details = document.getElementById('editDetails').value.trim();
      const mainLocInput = document.getElementById('editMainLoc');
      if (mainLocInput) item.mainLocation = mainLocInput.value.trim();
      saveState();
      renderApp();
      openItemModal(itemId, false);
    }

    function deleteItem(itemId) {
      if (!confirm('Naozaj chcete vymazať túto položku?')) return;
      const project = getCurrentProject();
      project.items = project.items.filter(i => i.id !== itemId);
      saveState();
      closeModal();
      renderApp();
    }

    function setEpisodeFilter(val) {
      appState.episodeFilter = val;
      document.getElementById('filterPopoverMenu').classList.add('hidden');
      renderApp();
    }

    function setSearchCategoryFilter(val) {
      appState.searchCategoryFilter = val;
      document.getElementById('filterPopoverMenu').classList.add('hidden');
      renderApp();
    }

    function handleSearch(val) {
      appState.searchQuery = val;
      document.getElementById('searchInput').value = val;
      const clearBtn = document.getElementById('clearSearchBtn');
      if (val) clearBtn.classList.remove('hidden');
      else clearBtn.classList.add('hidden');
      renderApp();
    }

    function handleFileUpload(event) {
      const file = event.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        const content = e.target.result;
        let cleanName = file.name.replace(/\.csv$/i, '').replace(/^Vyrobny_list_/i, '').replace(/_/g, ' ').trim();
        if (!cleanName) cleanName = 'Nová epizóda';
        const customName = prompt('Názov výrobného listu (časti):', cleanName);
        if (!customName) return;

        appState.projects[customName] = parseCSVToProject(customName, content);
        appState.activeProject = customName;
        appState.activeTab = 'HOME';
        appState.episodeFilter = 'ALL';
        saveState();
        syncHistoryPush();
        renderApp();
      };
      reader.readAsText(file, 'UTF-8');
      event.target.value = '';
    }

    function exportCurrentCSV() {
      const project = getCurrentProject();
      if (!project) return;
      const escapeCSV = (str) => {
        const s = String(str ?? '');
        if (s.includes(';') || s.includes('"') || s.includes('\n')) return '"' + s.replace(/"/g, '""') + '"';
        return s;
      };
      const rows = [['KATEGÓRIA', 'POLOŽKA / NÁZOV', 'OBRAZY (SCÉNY)', project.col4Header || 'TYP / LOKALITA', 'DETAILY A PRODUKČNÉ POZNÁMKY']];
      project.items.forEach(it => {
        rows.push([
          it.category,
          it.title,
          it.scenesRaw,
          it.locationOrEp,
          it.userNotes ? `${it.details} [POZN.: ${it.userNotes}]` : it.details
        ]);
      });
      const csvContent = '\uFEFF' + rows.map(r => r.map(escapeCSV).join(';')).join('\r\n');
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `Vyrobny_list_${project.name.replace(/\s+/g, '_')}.csv`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      closeModal();
    }

    function deleteCurrentProject() {
      const project = getCurrentProject();
      if (Object.keys(appState.projects).length <= 1) {
        return alert('V aplikácii musí zostať aspoň jedna časť.');
      }
      if (!confirm(`Naozaj chcete natrvalo odstrániť časť „${project.name}“?`)) return;
      delete appState.projects[project.name];
      appState.activeProject = Object.keys(appState.projects)[0];
      saveState();
      closeModal();
      syncHistoryPush();
      renderApp();
    }

    function toggleTheme() {
      document.documentElement.classList.toggle('dark');
    }

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });

    // Boot
    loadState();
    try {
      history.replaceState({
        activeProject: appState.activeProject,
        activeTab: appState.activeTab,
        locationsSubView: appState.locationsSubView,
        modalStack: []
      }, '');
    } catch (e) {}
    renderApp();
  </script>
</body>
</html>
