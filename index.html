    function openSceneModal(sceneCode, pushHistory = true) {
      const project = getCurrentProject();
      const { sceneMap } = buildSceneCatalog(project);
      const scObj = sceneMap[sceneCode];
      if (!scObj) return;

      const gastro = scObj.items.filter(i => i.group === 'GASTRO');
      const isFoodScene = gastro.length > 0;

      const modalCont = document.getElementById('modalContainer');
      if (modalCont) {
        modalCont.classList.remove('bg-purple-50/95', 'dark:bg-[#150d1e]', 'border-purple-500/40', 'dark:border-purple-500/40');
        if (isFoodScene) {
          modalCont.classList.add('bg-purple-50/95', 'dark:bg-[#150d1e]', 'border-purple-500/40', 'dark:border-purple-500/40');
        }
        if (scObj.done) {
          modalCont.classList.add('opacity-75', 'grayscale');
        } else {
          modalCont.classList.remove('opacity-75', 'grayscale');
        }
      }

      if (pushHistory) {
        modalStack.push({ type: 'SCENE', id: sceneCode });
        syncHistoryPush();
      }
      updateModalBackBtn();

      const scripts = scObj.items.filter(i => i.group === 'SCRIPT');
      const locs = scObj.items.filter(i => i.group === 'LOCATIONS');
      const cast = scObj.items.filter(i => i.group === 'CAST');
      
      const propsAll = scObj.items.filter(i => i.group === 'PROPS');
      const standaloneCostumes = scObj.items.filter(i => i.group === 'COSTUMES');

      const alerts = propsAll.filter(i => i.category === 'POZOR' || /uvedenie|upozornenie|pozor/i.test(i.title));
      const pureProps = propsAll.filter(i => i.category !== 'POZOR' && !/uvedenie|upozornenie|pozor/i.test(i.title));

      const sceneCostumesList = [];
      cast.forEach(actor => {
        const parsed = parseStructuredCostumes(actor.details, actor.title);
        parsed.costumes.forEach(c => {
          const disc = c.discrete && c.discrete.length > 0 ? c.discrete : Array.from(expandSceneTokens(c.scenesRaw));
          if (disc.includes(sceneCode)) {
            sceneCostumesList.push({
              actorName: actor.title,
              costumeName: c.name,
              costumeNum: c.num,
              actorId: actor.id
            });
          }
        });
      });

      standaloneCostumes.forEach(cItem => {
        sceneCostumesList.push({
          actorName: 'Kostým',
          costumeName: cItem.title,
          costumeNum: '',
          actorId: cItem.id
        });
      });

      let sceneTitle = '';
      if (scripts.length > 0 && scripts[0].title && scripts[0].title !== 'Scenár obrazu') {
        sceneTitle = scripts[0].title.replace(/^\d+\/\d+\s*/, '').replace(/^[–\-•\s]+/, '').trim();
      }
      if (!sceneTitle && locs.length > 0) {
        sceneTitle = locs[0].title.replace(/^Areál\s*(\([^)]*\))?\s*[:–\-]?\s*/i, '').trim();
      }

      document.getElementById('modalTitleWrap').innerHTML = `
        <div class="flex items-center gap-2 mb-1">
          <span class="text-xs font-extrabold px-2.5 py-0.5 rounded-lg bg-amber-500 text-zinc-950 inline-block">Obraz ${escapeHtml(sceneCode)}</span>
          ${isFoodScene ? `
            <button
              type="button"
              onclick="closeModal(); navigateTab('GASTRO');"
              title="Prejsť do sekcie Gastro"
              class="text-[11px] font-extrabold px-2.5 py-0.5 rounded-lg bg-purple-500/20 hover:bg-purple-500 hover:text-white text-purple-700 dark:text-purple-300 border border-purple-500/40 uppercase tracking-wider transition cursor-pointer active:scale-95"
            >
              Gastro
            </button>
          ` : ''}
        </div>
        <h2 class="font-extrabold text-base sm:text-lg text-zinc-900 dark:text-white leading-snug">${escapeHtml(sceneTitle || `Obraz ${sceneCode}`)}</h2>
      `;

      document.getElementById('modalHeaderAction').innerHTML = `
        <button onclick="toggleSceneDoneInModal('${escapeHtml(sceneCode)}')" class="px-3 py-1.5 rounded-xl font-extrabold text-xs transition flex items-center gap-1.5 shrink-0 ${
          scObj.done
            ? 'bg-zinc-200 dark:bg-zinc-800 text-zinc-500 dark:text-zinc-400'
            : 'bg-amber-500 text-zinc-950 hover:bg-amber-400'
        }">
          ${scObj.done ? `${ICONS.check}<span>Natočené</span>` : '<span>Označiť ako natočené</span>'}
        </button>
      `;

      const renderScriptPreview = () => {
        if (scripts.length === 0) return '';
        const scItem = scripts[0];
        const doneClasses = scObj.done ? 'relative script-done-cross opacity-50 grayscale' : '';
        const innerHtmlContent = scItem.customHtml || formatScriptLinesHTML(scItem.details, scItem.title);
        const stickyList = scItem.stickyNotes || [];

        return `
          <div class="space-y-2">
            <div class="flex items-center justify-between">
              <span class="text-[11px] font-bold uppercase tracking-wider text-amber-600 dark:text-amber-400">Scenár obrazu ${escapeHtml(sceneCode)}</span>
              <button onclick="openScriptReader('${escapeHtml(sceneCode)}')" class="px-3 py-1.5 rounded-xl bg-amber-500 hover:bg-amber-400 text-zinc-950 text-xs font-extrabold flex items-center gap-1.5 shadow-2xs transition">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"/></svg>
                <span>Celý scenár / Upraviť</span>
              </button>
            </div>
            <div
              id="modal-script-viewport-${escapeHtml(scItem.id)}"
              onclick="openScriptReader('${escapeHtml(sceneCode)}')"
              class="relative overflow-hidden cursor-pointer bg-[#fdfbf7] text-zinc-950 border border-zinc-300 dark:border-zinc-700 rounded-xl shadow-inner hover:border-amber-500 transition ${doneClasses}"
            >
              <div
                id="modal-script-scaler-${escapeHtml(scItem.id)}"
                class="origin-top-left relative px-5 sm:px-14 py-6 sm:py-10"
                style="width: 768px; font-family: 'Courier New', Courier, monospace; font-size: 16px; line-height: 1.55;"
              >
                <div id="modal-script-text-${escapeHtml(scItem.id)}" class="space-y-3.5 relative z-10 pointer-events-none">
                  ${innerHtmlContent}
                </div>
                <canvas id="modal-script-canvas-${escapeHtml(scItem.id)}" class="absolute inset-0 z-20 pointer-events-none"></canvas>
                <div class="absolute inset-0 z-30 pointer-events-none [&_*]:!pointer-events-none">
                  ${stickyList.map(st => renderSingleStickyHTML(scItem.id, st)).join('')}
                </div>
              </div>
            </div>
          </div>
        `;
      };

      const renderGroupList = (label, arr) => {
        if (!arr || arr.length === 0) return '';
        return `
          <div class="space-y-1.5">
            <span class="text-[11px] font-bold uppercase tracking-wider text-zinc-400 block">${label} (${arr.length})</span>
            <div class="bg-zinc-50 dark:bg-zinc-800/40 border border-zinc-200/60 dark:border-zinc-800 rounded-2xl divide-y divide-zinc-200/50 dark:divide-zinc-800 overflow-hidden">
              ${arr.map(it => `
                <div onclick="openItemModal('${it.id}')" class="p-3 hover:bg-zinc-100 dark:hover:bg-zinc-800 cursor-pointer transition flex items-center justify-between gap-3">
                  <div class="min-w-0">
                    <div class="font-bold text-xs sm:text-sm text-zinc-900 dark:text-white truncate">${escapeHtml(it.title)}</div>${it.details ? `<div class="text-xs text-zinc-500 dark:text-zinc-400 line-clamp-1 mt-0.5">${escapeHtml(it.details)}</div>` : ''}
                  </div>
                  <span class="text-amber-500 shrink-0">${ICONS.chevronRight}</span>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      };

      const renderCostumesSection = () => {
        if (sceneCostumesList.length === 0) return '';
        return `
          <div class="space-y-1.5">
            <span class="text-[11px] font-bold uppercase tracking-wider text-pink-600 dark:text-pink-400 block">Kostýmy (${sceneCostumesList.length})</span>
            <div class="bg-pink-500/5 border border-pink-500/20 rounded-2xl divide-y divide-pink-500/15 overflow-hidden">
              ${sceneCostumesList.map(c => `
                <div onclick="openItemModal('${c.actorId}')" class="p-3 hover:bg-pink-500/10 cursor-pointer transition flex items-center justify-between gap-3">
                  <div class="min-w-0">
                    <div class="font-bold text-xs sm:text-sm text-zinc-900 dark:text-white">
                      <span class="text-pink-600 dark:text-pink-400 font-extrabold mr-1.5">${escapeHtml(c.actorName)}:</span>
                      <span>${escapeHtml(c.costumeName)}</span>
                    </div>
                  </div>
                  <span class="text-pink-500 shrink-0">${ICONS.chevronRight}</span>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      };

      document.getElementById('modalBody').innerHTML = `
        ${renderScriptPreview()}
        ${renderGroupList('Lokácia', locs)}
        ${renderGroupList('Účinkujúci na pľaci', cast)}
        ${renderCostumesSection()}
        ${renderGroupList('Rekvizity', pureProps)}
        ${renderGroupList('Gastro v obraze', gastro)}
        ${renderGroupList('Upozornenia a technika (POZOR)', alerts)}
      `;

      document.getElementById('modalFooter').innerHTML = `
        <span class="text-[11px] text-zinc-400">Kliknite na položku pre plný detail</span>
        <button onclick="closeModal()" class="px-4 py-1.5 rounded-xl bg-zinc-200 dark:bg-zinc-800 text-xs font-bold">Zavrieť</button>
      `;

      showModalOverlay();

      if (scripts.length > 0) {
        setTimeout(() => {
          const scItem = scripts[0];
          const viewport = document.getElementById(`modal-script-viewport-${scItem.id}`);
          const scaler = document.getElementById(`modal-script-scaler-${scItem.id}`);
          const textEl = document.getElementById(`modal-script-text-${scItem.id}`);
          const canvas = document.getElementById(`modal-script-canvas-${scItem.id}`);

          if (viewport && scaler && textEl && canvas) {
            const paperEl = document.getElementById('scriptPaperContainer');
            const baseW = (paperEl && paperEl.offsetWidth > 200) ? paperEl.offsetWidth : 768;
            scaler.style.width = baseW + 'px';
            scaler.style.fontSize = scriptFontSize + 'px';

            fitAllStickyTextareas();

            const viewW = viewport.clientWidth || 400;
            const scale = Math.min(1, viewW / baseW);

            const contentW = baseW;
            const contentH = scaler.offsetHeight || 200;
            canvas.width = contentW;
            canvas.height = contentH;
            canvas.style.width = contentW + 'px';
            canvas.style.height = contentH + 'px';
            redrawCanvasStrokes(canvas, scItem.strokes || []);

            scaler.style.transform = `scale(${scale})`;
            viewport.style.height = `${contentH * scale}px`;
          }
        }, 30);
      }
    }

    async function extractTextFromPDF(arrayBuffer) {
      const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
      let fullText = '';
      for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const content = await page.getTextContent();
        let lastY = -1;
        content.items.forEach(item => {
          if (lastY !== item.transform[5] && lastY !== -1) {
            fullText += '\n';
          }
          fullText += item.str;
          lastY = item.transform[5];
        });
        fullText += '\n';
      }
      return fullText;
    }

    function handleFileUpload(event) {
      const file = event.target.files?.[0];
      if (!file) return;
      
      const fileName = file.name.toLowerCase();
      let cleanName = file.name.replace(/\.(csv|docx|pdf)$/i, '').replace(/^Vyrobny_list_/i, '').replace(/_/g, ' ').trim();
      if (!cleanName) cleanName = 'Nová epizóda';

      const customName = prompt('Názov výrobného listu (časti):', cleanName);
      if (!customName) {
        event.target.value = '';
        return;
      }

      if (fileName.endsWith('.docx')) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const arrayBuffer = e.target.result;
          mammoth.extractRawText({ arrayBuffer: arrayBuffer })
            .then(function(result) {
              const text = result.value;
              processExtractedDOCXScript(customName, text);
            })
            .catch(function(err) {
              alert('Chyba pri čítaní DOCX: ' + err.message);
            });
        };
        reader.readAsArrayBuffer(file);
      } else if (fileName.endsWith('.pdf')) {
        const reader = new FileReader();
        reader.onload = async function(e) {
          const arrayBuffer = e.target.result;
          try {
            const text = await extractTextFromPDF(arrayBuffer);
            processExtractedDOCXScript(customName, text);
          } catch (err) {
            alert('Chyba pri čítaní PDF: ' + err.message);
          }
        };
        reader.readAsArrayBuffer(file);
      } else if (fileName.endsWith('.csv')) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const content = e.target.result;
          appState.projects[customName] = parseCSVToProject(customName, content);
          appState.activeProject = customName;
          appState.activeTab = 'HOME';
          appState.episodeFilter = 'ALL';
          saveState();
          syncHistoryPush();
          renderApp();
        };
        reader.readAsText(file, 'UTF-8');
      } else {
        alert('Tento formát súboru zatiaľ nie je podporovaný (vyberte .docx, .pdf alebo .csv).');
      }
      event.target.value = '';
    }

function processExtractedDOCXScript(projectName, rawText) {
      const lines = rawText.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);
      const scenes = [];
      let currentScene = null;
      const headerRegex = /^(\d+\/\d+)\s+(EXT\.|INT\.)\s+(.*)$/i;

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];
        const match = line.match(headerRegex);

        if (match) {
          if (currentScene) scenes.push(currentScene);
          currentScene = {
            scNum: match[1].trim(),
            intExt: match[2].trim().toUpperCase(),
            locInfo: match[3].trim(),
            castLine: '',
            costumesLine: '',
            propsLine: '',
            gastroLine: '',
            komparzLine: '',
            scriptLines: [line]
          };
        } else if (currentScene) {
          currentScene.scriptLines.push(line);
          const lowLine = line.toLowerCase();
          
          if (currentScene.scriptLines.length === 2) {
             if (!line.startsWith('(') && !lowLine.startsWith('vo:')) {
                currentScene.castLine = line;
             }
          } else if (currentScene.scriptLines.length <= 8) {
             if (lowLine.startsWith('(kostým')) currentScene.costumesLine = line;
             else if (lowLine.startsWith('(rekvizit')) currentScene.propsLine = line;
             else if (lowLine.startsWith('(gastro')) currentScene.gastroLine = line;
             else if (lowLine.startsWith('(komparz')) currentScene.komparzLine = line;
          }
        }
      }
      if (currentScene) scenes.push(currentScene);

      if (scenes.length === 0) {
        alert('V dokumente sa nenašli žiadne obrazy. Uistite sa, že obsahujú zápis vo formáte "1/32 EXT. LOKÁCIA".');
        return;
      }

      const getBaseId = (type, index) => `${projectName.replace(/\s+/g, '_')}_${type}_${index}_${Math.random().toString(36).slice(2,6)}`;
      const registry = { LOCATIONS: {}, CAST: {}, PROPS: {}, GASTRO: {}, ALERTS: [], SCRIPTS: [] };

      scenes.forEach(scene => {
        let timeStr = '';
        let cleanLoc = scene.locInfo;
        if (cleanLoc.includes(' - ')) {
          const pts = cleanLoc.split(' - ');
          timeStr = pts.pop().trim();
          cleanLoc = pts.join(' - ').trim();
        } else if (cleanLoc.includes('-')) {
          const pts = cleanLoc.split('-');
          timeStr = pts.pop().trim();
          cleanLoc = pts.join('-').trim();
        }
        cleanLoc = cleanLoc.split('(')[0].trim() || cleanLoc;
        const locKey = scene.intExt + ' ' + cleanLoc;

        if (!registry.LOCATIONS[locKey]) {
          registry.LOCATIONS[locKey] = {
            category: 'LOKÁCIA (' + scene.intExt.replace('.', '') + ')',
            mainLocation: projectName,
            title: cleanLoc,
            locationOrEp: scene.intExt,
            details: timeStr || scene.locInfo,
            scenes: new Set()
          };
        }
        registry.LOCATIONS[locKey].scenes.add(scene.scNum);

        let synopsis = '';
        for (let j = 1; j < scene.scriptLines.length; j++) {
           const l = scene.scriptLines[j];
           if (l !== scene.castLine && !l.startsWith('(') && !l.toLowerCase().startsWith('vo:')) {
              synopsis = l;
              break;
           }
        }

        registry.SCRIPTS.push({
          id: getBaseId('script', scene.scNum.replace('/', '_')),
          category: 'SCENÁR',
          group: 'SCRIPT',
          mainLocation: '',
          title: synopsis || 'Scenár obrazu',
          scenesRaw: scene.scNum,
          locationOrEp: timeStr,
          details: scene.scriptLines.join(' || '),
          userNotes: '',
          checked: false
        });

        let cleanCostume = '';
        if (scene.costumesLine && !scene.costumesLine.toLowerCase().includes('žiadne')) {
           cleanCostume = scene.costumesLine.replace(/^\(kostýmy:\s*/i, '').replace(/^\(kostým:\s*/i, '').replace(/\)$/, '').trim();
        }

        if (scene.castLine) {
          const actors = scene.castLine.split(',').map(s => s.trim().replace(/\s*\(.*?\)/g, '')).filter(Boolean);
          actors.forEach(actor => {
            if (actor.toLowerCase().includes('komparz') || actor.toLowerCase().includes('dav')) {
               actor = 'Komparz: ' + actor;
            }
            if (!registry.CAST[actor]) registry.CAST[actor] = { scenes: new Set(), costumesMap: {} };
            registry.CAST[actor].scenes.add(scene.scNum);
            if (cleanCostume) {
               if (!registry.CAST[actor].costumesMap[cleanCostume]) registry.CAST[actor].costumesMap[cleanCostume] = new Set();
               registry.CAST[actor].costumesMap[cleanCostume].add(scene.scNum);
            }
          });
        }

        if (scene.komparzLine && !scene.komparzLine.toLowerCase().includes('žiadne')) {
          let cleanK = scene.komparzLine.replace(/^\(komparz:\s*/i, '').replace(/\)$/, '').trim();
          cleanK.split(',').map(s => s.trim()).filter(Boolean).forEach(k => {
             let kTitle = 'Komparz: ' + k.charAt(0).toUpperCase() + k.slice(1);
             if (!registry.CAST[kTitle]) registry.CAST[kTitle] = { scenes: new Set(), costumesMap: {} };
             registry.CAST[kTitle].scenes.add(scene.scNum);
             if (cleanCostume) {
                if (!registry.CAST[kTitle].costumesMap[cleanCostume]) registry.CAST[kTitle].costumesMap[cleanCostume] = new Set();
                registry.CAST[kTitle].costumesMap[cleanCostume].add(scene.scNum);
             }
          });
        }

        if (scene.propsLine && !scene.propsLine.toLowerCase().includes('žiadne')) {
          let cleanP = scene.propsLine.replace(/^\(rekvizity:\s*/i, '').replace(/\)$/, '').trim();
          cleanP.split(',').map(s => s.trim()).filter(Boolean).forEach(p => {
             let pTitle = p.charAt(0).toUpperCase() + p.slice(1);
             if (!registry.PROPS[pTitle]) registry.PROPS[pTitle] = new Set();
             registry.PROPS[pTitle].add(scene.scNum);
          });
        }

        let hasGastro = false;
        if (scene.gastroLine && !scene.gastroLine.toLowerCase().includes('žiadne')) {
          let cleanG = scene.gastroLine.replace(/^\(gastro:\s*/i, '').replace(/\)$/, '').trim();
          cleanG.split(',').map(s => s.trim()).filter(Boolean).forEach(g => {
             let gTitle = g.charAt(0).toUpperCase() + g.slice(1);
             if (!registry.GASTRO[gTitle]) registry.GASTRO[gTitle] = new Set();
             registry.GASTRO[gTitle].add(scene.scNum);
          });
          hasGastro = true;
        }

        if (!hasGastro) {
           const textLower = scene.scriptLines.join(' ').toLowerCase();
           const kw = ['víno', 'kaša', 'kašu', 'hrušk', 'slivk', 'koláč', 'med ', 'medom', 'orech', 'pivo', 'mäso', 'koreni'];
           const hits = kw.filter(k => textLower.includes(k));
           if (hits.length >= 2) {
              let gTitle = "Príprava / Jedlo (" + hits.slice(0, 3).join(', ') + ")";
              if (!registry.GASTRO[gTitle]) registry.GASTRO[gTitle] = new Set();
              registry.GASTRO[gTitle].add(scene.scNum);
           }
        }

        scene.scriptLines.forEach((line, idx) => {
          if (line.match(/\bPOZOR\b[:!]/i) || line.toLowerCase().startsWith('(pozor:')) {
             let cleanAlert = line.replace(/^\(pozor:\s*/i, '').replace(/\)$/, '').replace(/^POZOR[:!]\s*/i, '').trim();
             registry.ALERTS.push({
                id: getBaseId('alert', scene.scNum.replace('/','_') + idx),
                category: 'POZOR',
                group: 'PROPS',
                mainLocation: '',
                title: 'Upozornenie (Obraz ' + scene.scNum + ')',
                scenesRaw: scene.scNum,
                locationOrEp: locKey,
                details: cleanAlert,
                userNotes: '',
                checked: false
             });
          }
        });
      });

      const finalItems = [];

      let idxLoc = 0;
      for (const [locKey, data] of Object.entries(registry.LOCATIONS)) {
         finalItems.push({
            id: getBaseId('loc', idxLoc++),
            category: data.category,
            group: 'LOCATIONS',
            mainLocation: data.mainLocation,
            title: data.title,
            scenesRaw: Array.from(data.scenes).sort((a,b)=>parseInt(a.split('/')[0])-parseInt(b.split('/')[0])).join(', '),
            locationOrEp: data.locationOrEp,
            details: data.details,
            userNotes: '',
            checked: false
         });
      }

      let idxCast = 0;
      for (const [actor, data] of Object.entries(registry.CAST)) {
         let costumeDetails = '';
         let cNum = 1;
         const costKeys = Object.keys(data.costumesMap);
         if (costKeys.length > 0) {
           for (const cName of costKeys) {
              const scs = Array.from(data.costumesMap[cName]).sort((a,b)=>parseInt(a.split('/')[0])-parseInt(b.split('/')[0])).join(', ');
              costumeDetails += `${cNum}) ${cName} (${scs}). `;
              cNum++;
           }
         }
         finalItems.push({
            id: getBaseId('cast', idxCast++),
            category: 'ÚČINKUJÚCI',
            group: 'CAST',
            mainLocation: '',
            title: actor,
            scenesRaw: Array.from(data.scenes).sort((a,b)=>parseInt(a.split('/')[0])-parseInt(b.split('/')[0])).join(', '),
            locationOrEp: '',
            details: costumeDetails.trim(),
            userNotes: '',
            checked: false
         });
      }

      let idxProp = 0;
      for (const [prop, scenesSet] of Object.entries(registry.PROPS)) {
         finalItems.push({
            id: getBaseId('prop', idxProp++),
            category: 'REKVIZITY',
            group: 'PROPS',
            mainLocation: '',
            title: prop,
            scenesRaw: Array.from(scenesSet).sort((a,b)=>parseInt(a.split('/')[0])-parseInt(b.split('/')[0])).join(', '),
            locationOrEp: '',
            details: '',
            userNotes: '',
            checked: false
         });
      }

      let idxGastro = 0;
      for (const [gastro, scenesSet] of Object.entries(registry.GASTRO)) {
         finalItems.push({
            id: getBaseId('gastro', idxGastro++),
            category: 'GASTRO',
            group: 'GASTRO',
            mainLocation: '',

            scenesRaw: Array.from(scenesSet).sort((a,b)=>parseInt(a.split('/')[0])-parseInt(b.split('/')[0])).join(', '),
            locationOrEp: '',
            details: '',
            userNotes: '',
            checked: false
         });
      }

      finalItems.push(...registry.ALERTS);
      finalItems.push(...registry.SCRIPTS);

      appState.projects[projectName] = {
        name: projectName,
        col4Header: 'TYP / LOKALITA',
        items: finalItems,
        sceneDone: {}
      };
      appState.activeProject = projectName;
      appState.activeTab = 'HOME';
      appState.episodeFilter = 'ALL';
      saveState();
      syncHistoryPush();
      renderApp();
    }

    function exportCurrentCSV() {
      const project = getCurrentProject();
      if (!project) return;
      const escapeCSV = (str) => {
        const s = String(str ?? '');
        if (s.includes(';') || s.includes('"') || s.includes('\n')) return '"' + s.replace(/"/g, '""') + '"';
        return s;
      };
      const rows = [['KATEGÓRIA', 'POLOŽKA / NÁZOV', 'OBRAZY (SCÉNY)', project.col4Header || 'TYP / LOKALITA', 'DETAILY A PRODUKČNÉ POZNÁMKY']];
      project.items.forEach(it => {
        rows.push([
          it.category,
          it.title,
          it.scenesRaw,
          it.locationOrEp,
          it.userNotes ? `${it.details} [POZN.: ${it.userNotes}]` : it.details
        ]);
      });
      const csvContent = '\uFEFF' + rows.map(r => r.map(escapeCSV).join(';')).join('\r\n');
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `Vyrobny_list_${project.name.replace(/\s+/g, '_')}.csv`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      closeModal();
    }

      if (!confirm(`Naozaj chcete natrvalo odstrániť časť „${project.name}“?`)) return;
      delete appState.projects[project.name];
      appState.activeProject = Object.keys(appState.projects)[0];
      saveState();
      closeModal();
      syncHistoryPush();
      renderApp();
    }

    function applyScriptToolModeToDOM() {
      const isDrawing = ['PEN', 'HIGHLIGHT', 'ERASER'].includes(scriptToolState.mode);
      const isText = scriptToolState.mode === 'TEXT';
      const isSticky = scriptToolState.mode === 'STICKY';

      const scrollCont = document.getElementById('scriptReaderScroll');
      if (scrollCont) {
        if (isDrawing && fingerDrawingEnabled) {
          scrollCont.style.touchAction = 'none';
          scrollCont.style.overflowY = 'hidden';
        } else {
          scrollCont.style.touchAction = 'pan-y';
          scrollCont.style.overflowY = 'auto';
        }
      }

      const paperCont = document.getElementById('scriptPaperContainer');
      if (paperCont) {
        if (isDrawing && fingerDrawingEnabled) {
          paperCont.style.touchAction = 'none';
          paperCont.style.userSelect = 'none';
          paperCont.style.webkitUserSelect = 'none';
        } else {
          paperCont.style.touchAction = 'pan-y';
          paperCont.style.userSelect = (isDrawing && fingerDrawingEnabled) ? 'none' : '';
          paperCont.style.webkitUserSelect = (isDrawing && fingerDrawingEnabled) ? 'none' : '';

        stEl.style.pointerEvents = isDrawing ? 'none' : 'auto';

      document.querySelectorAll('.script-draw-canvas').forEach(cv => {

          el.style.cursor = isSticky ? 'copy' : 'default';

          el.style.webkitUserSelect = (isDrawing && fingerDrawingEnabled) ? 'none' : '';

    function formatScriptLinesHTML(rawDetails, synopsisTitle = '') {
      const lines = String(rawDetails || '').split(/\s*\|\|\s*/);
      const cleanSynopsis = (synopsisTitle || '').replace(/^\d+\/\d+\s*/, '').replace(/^[–\-•\s]+/, '').trim().toLowerCase();

      return lines.map((line, idx) => {
        let safe = escapeHtml(line)
          .replace(/&lt;b&gt;(.*?)&lt;\/b&gt;/g, '<strong>$1</strong>')
          .replace(/&lt;u&gt;(.*?)&lt;\/u&gt;/g, '<span class="underline">$1</span>');
        
        const cleanRaw = line.replace(/<\/?(?:b|strong)>/gi, '').trim();

        if (/^\d+\/\d+\s+(EXT\.|INT\.)/i.test(cleanRaw)) {
          return `<p class="font-extrabold text-zinc-950" style="font-weight: 900 !important; font-size: 1.05em !important;"><strong>${safe}</strong></p>`;
        }

        if (cleanSynopsis && cleanSynopsis !== 'scenár obrazu' && cleanRaw.toLowerCase() === cleanSynopsis) {
          return `<p class="font-extrabold text-zinc-950" style="font-weight: 900 !important; font-size: 1.02em !important;"><strong>${safe}</strong></p>`;
        }

        if (/^\(/i.test(cleanRaw)) {
          const prevRaw = idx > 0 ? lines[idx - 1].replace(/<\/?(?:b|strong)>/gi, '').trim() : '';
          const isDirectlyAfterParen = /^\(/i.test(prevRaw);
          const tightStyle = isDirectlyAfterParen ? 'margin-top: 1px !important;' : '';
          return `<p style="${tightStyle}">${safe}</p>`;
        }

        if (/^(Grafika|VO)/i.test(cleanRaw)) {
          return `<p class="py-1 px-2.5 rounded bg-amber-500/10 border-l-2 border-amber-500">${safe}</p>`;
        }
        return `<p>${safe}</p>`;
      }).join('');
    }

    function initScriptReaderLockGuards() {
      const ov = document.getElementById('scriptReaderOverlay');
      const scrollEl = document.getElementById('scriptReaderScroll');
      if (!ov || ov.dataset.lockGuardBound === '1') return;
      ov.dataset.lockGuardBound = '1';

      const preventSystemGesture = (e) => {
        if (e.cancelable) e.preventDefault();
        e.stopPropagation();
      };

      ov.addEventListener('gesturestart', preventSystemGesture, { passive: false });
      ov.addEventListener('gesturechange', preventSystemGesture, { passive: false });
      ov.addEventListener('gestureend', preventSystemGesture, { passive: false });

      ov.addEventListener('touchstart', (e) => {
        if (e.touches && e.touches.length > 1) {
          if (e.cancelable) e.preventDefault();
        }
      }, { passive: false });

      ov.addEventListener('touchmove', (e) => {
        if (e.target.closest('button, select, input, textarea, a, label, #scriptToolbarWrap')) {
          return;
        }
        if (!e.target.closest('#scriptReaderScroll')) {
          if (e.cancelable) e.preventDefault();
        }
      }, { passive: false });

      ov.addEventListener('pointerdown', (e) => {
        if (e.pointerType === 'pen' && e.target.closest('.script-draw-canvas')) {
          lastDrawingActivityTime = Date.now();
        }
      }, { capture: true });

      document.addEventListener('fullscreenchange', () => {
        if (document.fullscreenElement && document.exitFullscreen) {
          document.exitFullscreen().catch(() => {});
        }
      });
      document.addEventListener('webkitfullscreenchange', () => {
        if (document.webkitFullscreenElement && document.webkitExitFullscreen) {
          try { document.webkitExitFullscreen(); } catch (e) {}
        }
      });

      if (scrollEl) {
        scrollEl.addEventListener('touchstart', () => {
          if (scrollEl.scrollTop <= 0) {
            scrollEl.scrollTop = 1;
          } else if (scrollEl.scrollTop + scrollEl.clientHeight >= scrollEl.scrollHeight) {
            scrollEl.scrollTop = Math.max(1, scrollEl.scrollHeight - scrollEl.clientHeight - 1);
          }
        }, { passive: true });

        scrollEl.addEventListener('scroll', () => {
          if (!ov.classList.contains('hidden')) {
            saveScriptReaderLockState(true, document.getElementById('scriptJumpSelect')?.value || '');
          }
        }, { passive: true });
      }

      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') {
          restoreScriptReaderIfLocked();
        }
      });

      window.addEventListener('pageshow', () => {
        restoreScriptReaderIfLocked();
      });
    }

    function restoreScriptReaderIfLocked() {
      try {
        const raw = localStorage.getItem('script_reader_lock_v1');
        if (!raw) return;
        const lock = JSON.parse(raw);
        if (!lock || !lock.open) return;
        const ov = document.getElementById('scriptReaderOverlay');
        if (ov && ov.classList.contains('hidden')) {
          openScriptReader(lock.scene || '', lock.scrollTop || 1);
        }
      } catch (e) {}
    }

    function openScriptReader(targetSceneCode = '', restoreScrollTop = null) {
      const project = getCurrentProject();
      const scriptItems = project.items.filter(i => i.group === 'SCRIPT');
      if (scriptItems.length === 0) {
        alert('V tomto výrobnom liste zatiaľ nie sú nahraté riadky scenára.');
        return;
      }

      initScriptReaderLockGuards();

      const jumpSelect = document.getElementById('scriptJumpSelect');
      jumpSelect.innerHTML = scriptItems.map((it, idx) => {
        const scCode = (it.scenesRaw || `UVOD_${idx}`).trim();
        return `<option value="${escapeHtml(scCode)}" ${scCode === targetSceneCode ? 'selected' : ''}>${escapeHtml(it.title)}</option>`;
      }).join('');

      scriptToolbarOpen = false;
      renderScriptToolbar();
      updateScriptToolbarVisibilityUI();
      renderScriptPaperBlocks();

      const ov = document.getElementById('scriptReaderOverlay');
      ov.style.removeProperty('display');
      ov.classList.remove('hidden');
      ov.classList.add('flex');
      document.body.style.overflow = 'hidden';
      document.body.classList.add('script-reader-locked');

      saveScriptReaderLockState(true, targetSceneCode);

      setTimeout(() => {
        initAllScriptCanvases();
        fitAllStickyTextareas();
        applyScriptToolModeToDOM();
        const scrollEl = document.getElementById('scriptReaderScroll');
        if (typeof restoreScrollTop === 'number' && restoreScrollTop > 0) {
          scrollEl.scrollTop = restoreScrollTop;
        } else if (targetSceneCode) {
          scrollToScriptScene(targetSceneCode);
        } else {
          scrollEl.scrollTop = 1;
        }
      }, 50);
    }

                >
                  Vymazať kresbu

                <button
                  type="button"
                  onclick="event.stopPropagation(); printSingleScene('${escapeHtml(it.id)}')"

                >
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4H7v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"/></svg>

            <div
              id="script-annot-area-${escapeHtml(it.id)}"

            >
              <div
                id="script-text-${escapeHtml(it.id)}"

                class="script-editable-content space-y-3.5 relative z-10 focus:outline-none"
              >${innerHtmlContent}</div>

              <canvas
                id="script-canvas-${escapeHtml(it.id)}"
                data-item-id="${escapeHtml(it.id)}"
                class="script-draw-canvas absolute inset-0 z-20 pointer-events-none select-none"
              ></canvas>

              <div id="script-stickies-${escapeHtml(it.id)}" class="absolute inset-0 z-30 pointer-events-none">

    function getStickyDynamicFontSize(text) {
      const len = (text || '').trim().length;
      if (len <= 2) return '52px';
      if (len <= 5) return '40px';
      if (len <= 10) return '30px';
      if (len <= 18) return '24px';
      if (len <= 30) return '19px';
      if (len <= 50) return '15px';
      if (len <= 80) return '13px';
      return '11px';
    }

    function autoFitStickyText(ta) {
      if (!ta) return;
      ta.style.fontSize = getStickyDynamicFontSize(ta.value);
      ta.style.height = '0px';
      ta.style.height = (ta.scrollHeight + 4) + 'px';
    }

    function fitAllStickyTextareas() {
      document.querySelectorAll('[id^="sticky-text-"]').forEach(ta => {
        autoFitStickyText(ta);
      });
    }

    function renderSingleStickyHTML(itemId, st) {
      const bgMap = {
        '#ef4444': 'bg-rose-100 border-rose-400 text-rose-950',
        '#facc15': 'bg-amber-100 border-amber-400 text-amber-950',
        '#3b82f6': 'bg-sky-100 border-sky-400 text-sky-950',
        '#22c55e': 'bg-emerald-100 border-emerald-400 text-emerald-950',
        '#18181b': 'bg-zinc-200 border-zinc-500 text-zinc-950'
      };
      const colorCls = bgMap[st.color] || bgMap['#facc15'];
      const dynamicSize = getStickyDynamicFontSize(st.text);

      return `
        <div
          id="sticky-dom-${escapeHtml(st.id)}"
          style="left: ${st.x}%; top: ${st.y}px; touch-action: none; -webkit-user-select: none; user-select: none;"
          onclick="event.stopPropagation()"
          onpointerdown="handleStickyPointerDown(event, '${escapeHtml(itemId)}', '${escapeHtml(st.id)}')"
          class="pointer-events-auto absolute w-48 sm:w-56 min-h-[115px] rounded-2xl border-2 shadow-lg p-3 flex items-center justify-center transition-shadow hover:shadow-2xl group cursor-move select-none ${colorCls}"
          title="Ťahaním posuniete • Ťuknutím píšete"
        >
          <textarea
            id="sticky-text-${escapeHtml(st.id)}"
            rows="1"
            onfocus="onStickyFocus('${escapeHtml(itemId)}', '${escapeHtml(st.id)}', this)"
            onblur="onStickyBlur('${escapeHtml(itemId)}', '${escapeHtml(st.id)}', this)"
            oninput="handleStickyInput('${escapeHtml(itemId)}', '${escapeHtml(st.id)}', this)"
            placeholder="..."
            class="w-full bg-transparent font-extrabold leading-tight focus:outline-none resize-none overflow-hidden cursor-move pointer-events-none text-center m-auto"
            style="font-family: 'Plus Jakarta Sans', sans-serif; font-size: ${dynamicSize};"
          >${escapeHtml(st.text || '')}</textarea>
          
          <button
            id="sticky-del-${escapeHtml(st.id)}"
            onpointerdown="event.stopPropagation()"
            onclick="event.stopPropagation(); deleteStickyNote('${escapeHtml(itemId)}', '${escapeHtml(st.id)}')"
            class="hidden absolute -top-2.5 -right-2.5 w-6 h-6 rounded-full bg-zinc-900 text-white text-xs font-extrabold items-center justify-center transition shadow-md cursor-pointer z-20"
          >×</button>
        </div>
      `;
    }

    function activateStickyText(e, stickyId) {
      if (e && e.stopPropagation) e.stopPropagation();
      const ta = document.getElementById(`sticky-text-${stickyId}`);
      const delBtn = document.getElementById(`sticky-del-${stickyId}`);
      if (ta) {
        ta.classList.remove('pointer-events-none', 'cursor-move');
        ta.classList.add('cursor-text');
        autoFitStickyText(ta);
        ta.focus();
      }
      if (delBtn) {
        delBtn.classList.remove('hidden');
        delBtn.classList.add('flex');
      }
    }

    let stickyOldTextBeforeEdit = '';
    function onStickyFocus(itemId, stickyId, ta) {
      stickyOldTextBeforeEdit = ta.value;
    }

    function onStickyBlur(itemId, stickyId, ta) {
      ta.classList.add('pointer-events-none', 'cursor-move');
      ta.classList.remove('cursor-text');
      const delBtn = document.getElementById(`sticky-del-${stickyId}`);
      if (delBtn) {
        setTimeout(() => {
          delBtn.classList.add('hidden');
          delBtn.classList.remove('flex');
        }, 120);
      }
      if (ta.value !== stickyOldTextBeforeEdit) {
        pushScriptAction({
          type: 'STICKY_EDIT',
          itemId,
          stickyId,
          oldText: stickyOldTextBeforeEdit,
          newText: ta.value
        });
      }
    }

    function handleStickyPointerDown(e, itemId, stickyId) {
      if (e.target.closest('button')) return;
      const ta = document.getElementById(`sticky-text-${stickyId}`);
      if (ta && document.activeElement === ta) return;
      startDragSticky(e, itemId, stickyId);
    }

    function saveScriptEditableText(itemId, el) {
      const project = getCurrentProject();
      const item = project.items.find(i => i.id === itemId);
      if (!item) return;
      item.customHtml = el.innerHTML;
      const paragraphs = Array.from(el.querySelectorAll('p')).map(p => p.innerText.trim()).filter(Boolean);
      if (paragraphs.length > 0) {
        item.details = paragraphs.join(' || ');
      }
      saveState();
      renderApp();
    }

    let drawingSaveTimer = null;
    function scheduleDrawingSaveState() {
      if (drawingSaveTimer) clearTimeout(drawingSaveTimer);
      drawingSaveTimer = setTimeout(() => {
        drawingSaveTimer = null;
        saveState();
      }, 650);
    }

    function updateUndoRedoButtonsUI() {
      const undoBtn = document.getElementById('scriptUndoBtn');
      const redoBtn = document.getElementById('scriptRedoBtn');
      const canUndo = scriptUndoStack.length > 0;
      const canRedo = scriptRedoStack.length > 0;
      const activeCls = ['bg-zinc-800', 'text-zinc-200', 'hover:bg-amber-500', 'hover:text-zinc-950'];
      const disabledCls = ['bg-zinc-800/40', 'text-zinc-600', 'cursor-not-allowed'];

      if (undoBtn) {
        undoBtn.disabled = !canUndo;
        undoBtn.classList.remove(...activeCls, ...disabledCls);
        undoBtn.classList.add(...(canUndo ? activeCls : disabledCls));
      }
      if (redoBtn) {
        redoBtn.disabled = !canRedo;
        redoBtn.classList.remove(...activeCls, ...disabledCls);
        redoBtn.classList.add(...(canRedo ? activeCls : disabledCls));
      }
    }

    function pushScriptAction(action) {
      scriptUndoStack.push(action);
      scriptRedoStack = [];
      updateUndoRedoButtonsUI();
    }

    function handleScriptBlockClick(e, itemId) {
      if (scriptToolState.mode !== 'STICKY') return;
      const area = document.getElementById(`script-annot-area-${itemId}`);
      if (!area) return;

      const rect = area.getBoundingClientRect();
      const xPct = Math.max(1, Math.min(82, Math.round(((e.clientX - rect.left) / rect.width) * 100)));
      const yPx = Math.max(5, Math.round(e.clientY - rect.top));

      const project = getCurrentProject();
      const item = project.items.find(i => i.id === itemId);
      if (!item) return;
      if (!item.stickyNotes) item.stickyNotes = [];

      const newSticky = {
        id: 'st_' + Date.now(),
        x: xPct,
        y: yPx,
        color: scriptToolState.color,
        text: '',
        minimized: false
      };
      item.stickyNotes.push(newSticky);

      pushScriptAction({
        type: 'STICKY_ADD',
        itemId,
        sticky: JSON.parse(JSON.stringify(newSticky))
      });

      saveState();

      const stickiesWrap = document.getElementById(`script-stickies-${itemId}`);
      if (stickiesWrap) {
        stickiesWrap.innerHTML = item.stickyNotes.map(st => renderSingleStickyHTML(itemId, st)).join('');
      }
      setScriptToolMode('READ');

      setTimeout(() => {
        activateStickyText(null, newSticky.id);
      }, 50);
    }

    function handleStickyInput(itemId, stickyId, ta) {
      autoFitStickyText(ta);
      updateStickyText(itemId, stickyId, ta.value);
    }

    function updateStickyText(itemId, stickyId, val) {
      const project = getCurrentProject();
      const item = project.items.find(i => i.id === itemId);
      const st = item?.stickyNotes?.find(s => s.id === stickyId);
      if (st) {
        st.text = val;
        saveState();
      }
    }

    function deleteStickyNote(itemId, stickyId) {
      const project = getCurrentProject();
      const item = project.items.find(i => i.id === itemId);
      if (!item || !item.stickyNotes) return;
      const st = item.stickyNotes.find(s => s.id === stickyId);
      if (!st) return;

      pushScriptAction({
        type: 'STICKY_DELETE',
        itemId,
        sticky: JSON.parse(JSON.stringify(st))
      });

      item.stickyNotes = item.stickyNotes.filter(s => s.id !== stickyId);
      saveState();
      const stickiesWrap = document.getElementById(`script-stickies-${itemId}`);
      if (stickiesWrap) {
        stickiesWrap.innerHTML = item.stickyNotes.map(s => renderSingleStickyHTML(itemId, s)).join('');
      }
    }

    function startDragSticky(e, itemId, stickyId) {
      e.preventDefault();
      e.stopPropagation();

      const domEl = document.getElementById(`sticky-dom-${stickyId}`);
      const parentEl = document.getElementById(`script-stickies-${itemId}`);
      if (!domEl || !parentEl) return;

      const activePointerId = e.pointerId;
      try {
        domEl.setPointerCapture(activePointerId);
      } catch (err) {}

      const parentRect = parentEl.getBoundingClientRect();
      const startX = e.clientX;
      const startY = e.clientY;

      const project = getCurrentProject();
      const item = project.items.find(i => i.id === itemId);
      const st = item?.stickyNotes?.find(s => s.id === stickyId);
      if (!st) return;

      const origX = st.x;
      const origY = st.y;
      let moved = false;

      domEl.style.zIndex = '999';

      const onMove = (moveEv) => {
        if (moveEv.pointerId !== activePointerId) return;
        moveEv.preventDefault();
        const dxPx = moveEv.clientX - startX;
        const dyPx = moveEv.clientY - startY;

        if (!moved && Math.hypot(dxPx, dyPx) > 6) {
          moved = true;
          if (document.activeElement && document.activeElement.tagName === 'TEXTAREA') {
            document.activeElement.blur();
          }
        }

        if (moved) {
          const dxPct = (dxPx / (parentRect.width || 600)) * 100;
          st.x = Math.max(-5, Math.min(88, Math.round(origX + dxPct)));
          st.y = Math.round(origY + dyPx);
          domEl.style.left = `${st.x}%`;
          domEl.style.top = `${st.y}px`;
        }
      };

      const onEnd = (endEv) => {
        if (endEv.pointerId !== activePointerId) return;
        domEl.removeEventListener('pointermove', onMove);
        domEl.removeEventListener('pointerup', onEnd);
        domEl.removeEventListener('pointercancel', onEnd);
        try {
          domEl.releasePointerCapture(activePointerId);
        } catch (err) {}
        domEl.style.zIndex = '';

        if (!moved) {
          activateStickyText(endEv, stickyId);
          return;
        }

        const stickyRect = domEl.getBoundingClientRect();
        const stickyCenterY = stickyRect.top + stickyRect.height / 2;
        let targetItemId = itemId;
        let finalY = st.y;

        document.querySelectorAll('.script-block-container').forEach(block => {
          const bRect = block.getBoundingClientRect();
          if (stickyCenterY >= bRect.top && stickyCenterY <= bRect.bottom) {
            const candidateId = block.getAttribute('data-item-id');
            const candidateArea = document.getElementById(`script-annot-area-${candidateId}`);
            if (candidateId && candidateArea) {
              targetItemId = candidateId;
              const areaRect = candidateArea.getBoundingClientRect();
              finalY = Math.round(stickyRect.top - areaRect.top);
            }
          }
        });

        if (targetItemId !== itemId) {
          const targetItem = project.items.find(i => i.id === targetItemId);
          if (targetItem) {
            item.stickyNotes = item.stickyNotes.filter(s => s.id !== stickyId);
            if (!targetItem.stickyNotes) targetItem.stickyNotes = [];
            st.y = finalY;
            targetItem.stickyNotes.push(st);
            refreshStickiesDOM(itemId);
            refreshStickiesDOM(targetItemId);
          }
        }

        pushScriptAction({
          type: 'STICKY_MOVE',
          itemId,
          targetItemId,
          stickyId,
          from: { x: origX, y: origY },
          to: { x: st.x, y: st.y }
        });
        saveState();
      };

      domEl.addEventListener('pointermove', onMove);
      domEl.addEventListener('pointerup', onEnd);
      domEl.addEventListener('pointercancel', onEnd);
    }

    function initAllScriptCanvases() {
      const project = getCurrentProject();
      document.querySelectorAll('.script-draw-canvas').forEach(canvas => {
        const itemId = canvas.getAttribute('data-item-id');
        const area = document.getElementById(`script-annot-area-${itemId}`) || canvas.parentElement;
        if (!area) return;

        const w = area.offsetWidth || 768;
        const h = area.offsetHeight || 200;
        canvas.width = w;
        canvas.height = h;
        canvas.style.width = w + 'px';
        canvas.style.height = h + 'px';

        const item = project.items.find(i => i.id === itemId);
        redrawCanvasStrokes(canvas, item?.strokes || []);
        bindCanvasDrawingEvents(canvas, itemId);
      });
    }

    function getEraserPixelWidth(sizeVal) {
      if (sizeVal >= 7) return 230;
      if (sizeVal >= 4) return 115;
      return 24;
    }

    function getPenPressureWidth(baseSize, pressure) {
      const p = (typeof pressure === 'number' && pressure > 0) ? pressure : 0.3;
      const clamped = Math.max(0.02, Math.min(1, p));
      const factor = 0.2 + Math.pow(clamped, 1.75) * 6.4;
      return Math.max(0.5, Math.round(baseSize * factor * 10) / 10);
    }

    function applyStrokeStyleToContext(ctx, stroke) {
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      if (stroke.mode === 'ERASER') {
        ctx.globalCompositeOperation = 'destination-out';
        ctx.globalAlpha = 1;
        ctx.lineWidth = getEraserPixelWidth(stroke.size);
        ctx.strokeStyle = 'rgba(0,0,0,1)';
      } else if (stroke.mode === 'HIGHLIGHT') {
        ctx.globalCompositeOperation = 'source-over';
        ctx.globalAlpha = 0.35;
        ctx.lineWidth = stroke.size * 4.5;
        ctx.strokeStyle = stroke.color;
      } else {
        ctx.globalCompositeOperation = 'source-over';
        ctx.globalAlpha = 1;
        ctx.lineWidth = stroke.size;
        ctx.strokeStyle = stroke.color;
      }
    }

    function redrawCanvasStrokes(canvas, strokes) {
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      (strokes || []).forEach(stroke => {
        if (!stroke.points || stroke.points.length === 0) return;
        ctx.save();
        applyStrokeStyleToContext(ctx, stroke);

        if (stroke.mode === 'PEN') {
          if (stroke.points.length === 1) {
            const pt0 = stroke.points[0];
            ctx.lineWidth = getPenPressureWidth(stroke.size, pt0.p);
            ctx.beginPath();
            const px = pt0.x * canvas.width;
            const py = pt0.y * canvas.height;
            ctx.moveTo(px, py);
            ctx.lineTo(px + 0.5, py + 0.5);
            ctx.stroke();
          } else {
            for (let i = 1; i < stroke.points.length; i++) {
              const prev = stroke.points[i - 1];
              const pt = stroke.points[i];
              ctx.lineWidth = getPenPressureWidth(stroke.size, pt.p);
              ctx.beginPath();
              ctx.moveTo(prev.x * canvas.width, prev.y * canvas.height);
              ctx.lineTo(pt.x * canvas.width, pt.y * canvas.height);
              ctx.stroke();
            }
          }
          ctx.restore();
          return;
        }

        ctx.beginPath();
        stroke.points.forEach((pt, idx) => {
          const px = pt.x * canvas.width;
          const py = pt.y * canvas.height;
          if (idx === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        });
        if (stroke.points.length === 1) {
          const px = stroke.points[0].x * canvas.width;
          const py = stroke.points[0].y * canvas.height;
          ctx.lineTo(px + 0.5, py + 0.5);
        }
        ctx.stroke();
        ctx.restore();
      });
    }

    function bindCanvasDrawingEvents(canvas, itemId) {
      if (canvas.dataset.bound === '1') return;
      canvas.dataset.bound = '1';

      let activePointerId = null;
      let activePointerType = null;
      let currentStroke = null;
      let cachedRect = null;
      let lastSmoothedPressure = 0.5;

      const blockTouchIfDrawing = (te) => {
        if (['PEN', 'HIGHLIGHT', 'ERASER'].includes(scriptToolState.mode)) {
          if (fingerDrawingEnabled) {
            if (te.cancelable) te.preventDefault();
            te.stopPropagation();
          }
        }
      };

      canvas.addEventListener('touchstart', blockTouchIfDrawing, { passive: false });
      canvas.addEventListener('touchmove', blockTouchIfDrawing, { passive: false });
      canvas.addEventListener('touchend', blockTouchIfDrawing, { passive: false });

      const getPosFromRect = (clientX, clientY, r, pressureVal) => {
        const rx = Math.max(0, Math.min(1, (clientX - r.left) / (r.width || 1)));
        const ry = Math.max(0, Math.min(1, (clientY - r.top) / (r.height || 1)));
        return {
          x: Math.round(rx * 10000) / 10000,
          y: Math.round(ry * 10000) / 10000,
          p: Math.round(pressureVal * 1000) / 1000
        };
      };

      canvas.addEventListener('pointerdown', (e) => {
        if (!['PEN', 'HIGHLIGHT', 'ERASER'].includes(scriptToolState.mode)) return;

        // Inteligentné pero: Ak je kreslenie prstom vypnuté, prst ani dlaň nekreslia (iba posúvajú text)
        if (e.pointerType === 'touch' && !fingerDrawingEnabled) {
          return;
        }

        // Ak je kreslenie prstom zapnuté, filtrujeme iba veľkú dlaň
        if (e.pointerType === 'touch' && fingerDrawingEnabled) {
          if ((e.width && e.width > 85) || (e.height && e.height > 85)) return;
        }

        const project = getCurrentProject();
        const item = project.items.find(i => i.id === itemId);
        if (!item) return;
        if (!item.strokes) item.strokes = [];

        if (activePointerId !== null && activePointerId !== e.pointerId) {
          if (e.pointerType === 'pen' && activePointerType !== 'pen') {
            if (currentStroke && item.strokes[item.strokes.length - 1] === currentStroke) {
              item.strokes.pop();
              redrawCanvasStrokes(canvas, item.strokes);
            }
            activePointerId = null;
            currentStroke = null;
          } else {
            return;
          }
        }

        if (e.cancelable) e.preventDefault();
        e.stopPropagation();

        activePointerId = e.pointerId;
        activePointerType = e.pointerType;
        cachedRect = canvas.getBoundingClientRect();

        const rawP = (e.pointerType === 'pen' && e.pressure > 0) ? e.pressure : 0.5;
        lastSmoothedPressure = rawP;

        const startPt = getPosFromRect(e.clientX, e.clientY, cachedRect, lastSmoothedPressure);
        currentStroke = {
          mode: scriptToolState.mode,
          color: scriptToolState.color,
          size: scriptToolState.size,
          points: [startPt]
        };
        item.strokes.push(currentStroke);

        const ctx = canvas.getContext('2d');
        ctx.save();
        applyStrokeStyleToContext(ctx, currentStroke);
        if (currentStroke.mode === 'PEN') {
          ctx.lineWidth = getPenPressureWidth(currentStroke.size, startPt.p);
        }
        ctx.beginPath();
        const px = startPt.x * canvas.width;
        const py = startPt.y * canvas.height;
        ctx.moveTo(px, py);
        ctx.lineTo(px + 0.5, py + 0.5);
        ctx.stroke();
        ctx.restore();
      }, { passive: false });

      canvas.addEventListener('pointermove', (e) => {
        if (e.pointerId !== activePointerId || !currentStroke) return;
        if (e.cancelable) e.preventDefault();
        e.stopPropagation();

        const r = cachedRect || canvas.getBoundingClientRect();
        const ctx = canvas.getContext('2d');

        if (currentStroke.mode === 'HIGHLIGHT') {
          const pt = getPosFromRect(e.clientX, e.clientY, r, 0.5);
          const prev = currentStroke.points[currentStroke.points.length - 1];
          if (!prev || Math.hypot(pt.x - prev.x, pt.y - prev.y) > 0.002) {
            currentStroke.points.push(pt);
            const project = getCurrentProject();
            const item = project.items.find(i => i.id === itemId);
            if (item) redrawCanvasStrokes(canvas, item.strokes);
          }
          return;
        }

        const events = (typeof e.getCoalescedEvents === 'function') ? e.getCoalescedEvents() : [e];
        ctx.save();
        applyStrokeStyleToContext(ctx, currentStroke);

        events.forEach(ev => {
          const prev = currentStroke.points[currentStroke.points.length - 1];
          const rawP = (e.pointerType === 'pen' && ev.pressure > 0) ? ev.pressure : 0.3;
          lastSmoothedPressure = lastSmoothedPressure * 0.22 + rawP * 0.78;
          const pt = getPosFromRect(ev.clientX, ev.clientY, r, lastSmoothedPressure);

          if (!prev || Math.hypot(pt.x - prev.x, pt.y - prev.y) > 0.0007) {
            currentStroke.points.push(pt);
            if (currentStroke.mode === 'PEN') {
              ctx.lineWidth = getPenPressureWidth(currentStroke.size, pt.p);
            }
            ctx.beginPath();
            ctx.moveTo(prev.x * canvas.width, prev.y * canvas.height);
            ctx.lineTo(pt.x * canvas.width, pt.y * canvas.height);
            ctx.stroke();
          }
        });

        ctx.restore();
      }, { passive: false });

      const finishStroke = (e) => {
        if (e.pointerId !== activePointerId) return;
        activePointerId = null;
        activePointerType = null;
        cachedRect = null;

        if (currentStroke) {
          pushScriptAction({ type: 'STROKE', itemId, stroke: currentStroke });
          const clearBtn = document.getElementById(`clear-strokes-btn-${itemId}`);
          if (clearBtn) {
            clearBtn.classList.remove('hidden');
            clearBtn.classList.add('inline-flex');
          }
        }
        currentStroke = null;
        scheduleDrawingSaveState();
      };

      canvas.addEventListener('pointerup', finishStroke);
      canvas.addEventListener('pointercancel', finishStroke);
      canvas.addEventListener('lostpointercapture', finishStroke);
    }

    function undoScriptStroke() {
      if (scriptUndoStack.length === 0) return;
      const act = scriptUndoStack.pop();
      const project = getCurrentProject();
      const item = project.items.find(i => i.id === act.itemId);

      if (act.type === 'STROKE' && item && item.strokes && item.strokes.length > 0) {
        const popped = item.strokes.pop();
        scriptRedoStack.push({ type: 'STROKE', itemId: act.itemId, stroke: popped });
        const canvas = document.getElementById(`script-canvas-${act.itemId}`);
        if (canvas) redrawCanvasStrokes(canvas, item.strokes);
        if (!item.strokes || item.strokes.length === 0) {
          const clearBtn = document.getElementById(`clear-strokes-btn-${act.itemId}`);
          if (clearBtn) {
            clearBtn.classList.add('hidden');
            clearBtn.classList.remove('inline-flex');
          }
        }
      } else if (act.type === 'STICKY_ADD' && item && item.stickyNotes) {
        item.stickyNotes = item.stickyNotes.filter(s => s.id !== act.sticky.id);
        scriptRedoStack.push(act);
        refreshStickiesDOM(act.itemId);
      } else if (act.type === 'STICKY_DELETE' && item) {
        if (!item.stickyNotes) item.stickyNotes = [];
        item.stickyNotes.push(act.sticky);
        scriptRedoStack.push(act);
        refreshStickiesDOM(act.itemId);
      } else if (act.type === 'STICKY_MOVE') {
        const currentHolderId = act.targetItemId || act.itemId;
        const holderItem = project.items.find(i => i.id === currentHolderId);
        const origItem = project.items.find(i => i.id === act.itemId);
        const st = holderItem?.stickyNotes?.find(s => s.id === act.stickyId);
        if (st && origItem) {
          if (currentHolderId !== act.itemId) {
            holderItem.stickyNotes = holderItem.stickyNotes.filter(s => s.id !== act.stickyId);
            if (!origItem.stickyNotes) origItem.stickyNotes = [];
            origItem.stickyNotes.push(st);
          }
          st.x = act.from.x;
          st.y = act.from.y;
          scriptRedoStack.push(act);
          refreshStickiesDOM(currentHolderId);
          if (currentHolderId !== act.itemId) refreshStickiesDOM(act.itemId);
        }
      } else if (act.type === 'STICKY_EDIT' && item && item.stickyNotes) {
        const st = item.stickyNotes.find(s => s.id === act.stickyId);
        if (st) {
          st.text = act.oldText;
          scriptRedoStack.push(act);
          refreshStickiesDOM(act.itemId);
        }
      }

      saveState();
      renderScriptToolbar();
    }

    function redoScriptStroke() {
      if (scriptRedoStack.length === 0) return;
      const act = scriptRedoStack.pop();
      const project = getCurrentProject();
      const item = project.items.find(i => i.id === act.itemId);

      if (act.type === 'STROKE' && item) {
        if (!item.strokes) item.strokes = [];
        item.strokes.push(act.stroke);
        scriptUndoStack.push(act);
        const canvas = document.getElementById(`script-canvas-${act.itemId}`);
        if (canvas) redrawCanvasStrokes(canvas, item.strokes);
      } else if (act.type === 'STICKY_ADD' && item) {
        if (!item.stickyNotes) item.stickyNotes = [];
        item.stickyNotes.push(act.sticky);
        scriptUndoStack.push(act);
        refreshStickiesDOM(act.itemId);
      } else if (act.type === 'STICKY_DELETE' && item && item.stickyNotes) {
        item.stickyNotes = item.stickyNotes.filter(s => s.id !== act.sticky.id);
        scriptUndoStack.push(act);
        refreshStickiesDOM(act.itemId);
      } else if (act.type === 'STICKY_MOVE') {
        const destId = act.targetItemId || act.itemId;
        const origItem = project.items.find(i => i.id === act.itemId);
        const destItem = project.items.find(i => i.id === destId);
        const st = origItem?.stickyNotes?.find(s => s.id === act.stickyId);
        if (st && destItem) {
          if (destId !== act.itemId) {
            origItem.stickyNotes = origItem.stickyNotes.filter(s => s.id !== act.stickyId);
            if (!destItem.stickyNotes) destItem.stickyNotes = [];
            destItem.stickyNotes.push(st);
          }
          st.x = act.to.x;
          st.y = act.to.y;
          scriptUndoStack.push(act);
          refreshStickiesDOM(act.itemId);
          if (destId !== act.itemId) refreshStickiesDOM(destId);
        }
      } else if (act.type === 'STICKY_EDIT' && item && item.stickyNotes) {
        const st = item.stickyNotes.find(s => s.id === act.stickyId);
        if (st) {
          st.text = act.newText;
          scriptUndoStack.push(act);
          refreshStickiesDOM(act.itemId);
        }
      }

      saveState();
      renderScriptToolbar();
    }

    function refreshStickiesDOM(itemId) {
      const project = getCurrentProject();
      const item = project.items.find(i => i.id === itemId);
      const wrap = document.getElementById(`script-stickies-${itemId}`);
      if (wrap && item) {
        wrap.innerHTML = (item.stickyNotes || []).map(st => renderSingleStickyHTML(itemId, st)).join('');
        fitAllStickyTextareas();
      }
    }

    function clearSceneStrokes(itemId) {
      if (!confirm('Vymazať všetky kresby perom v tomto obraze?')) return;
      const project = getCurrentProject();
      const item = project.items.find(i => i.id === itemId);
      if (item) {
        item.strokes = [];
        scriptUndoStack = scriptUndoStack.filter(a => a.itemId !== itemId);
        scriptRedoStack = scriptRedoStack.filter(a => a.itemId !== itemId);
        saveState();
        renderScriptToolbar();
        const canvas = document.getElementById(`script-canvas-${itemId}`);
        if (canvas) redrawCanvasStrokes(canvas, []);
        const clearBtn = document.getElementById(`clear-strokes-btn-${itemId}`);
        if (clearBtn) {
          clearBtn.classList.add('hidden');
          clearBtn.classList.remove('inline-flex');
        }
      }
    }

    function toggleSceneDoneInScript(sceneCode) {
      const project = getCurrentProject();
      if (!project.sceneDone) project.sceneDone = {};
      project.sceneDone[sceneCode] = !project.sceneDone[sceneCode];
      saveState();
      syncDataToGoogleDrive(true);
      renderApp();
      renderScriptPaperBlocks();
      setTimeout(() => {
        initAllScriptCanvases();
        fitAllStickyTextareas();
        applyScriptToolModeToDOM();
      }, 20);
      if (modalStack.length > 0) {
        const top = modalStack[modalStack.length - 1];
        if (top.type === 'SCENE') openSceneModal(top.id, false);
        else if (top.type === 'ITEM') openItemModal(top.id, false);
        else if (top.type === 'MAIN_LOC') openMainLocationModal(top.id, false);
      }
    }

    function scrollToScriptScene(scCode) {
      const el = document.getElementById(`script-anchor-${scCode}`);
      if (el) {
        el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        const sel = document.getElementById('scriptJumpSelect');
        if (sel) sel.value = scCode;
      }

    function updateFontResetBtnUI() {
      const btn = document.getElementById('scriptFontResetBtn');
      if (!btn) return;
      btn.textContent = `${scriptFontSize}px`;
      if (scriptFontSize !== 16) {
        btn.classList.remove('text-zinc-400', 'bg-zinc-800');
        btn.classList.add('bg-amber-500/20', 'text-amber-400', 'border', 'border-amber-500/40');
      } else {
        btn.classList.add('text-zinc-400', 'bg-zinc-800');
        btn.classList.remove('bg-amber-500/20', 'text-amber-400', 'border', 'border-amber-500/40');
      }
    }

    function captureScriptScrollAnchor() {
      const scrollEl = document.getElementById('scriptReaderScroll');
      if (!scrollEl) return null;
      if (scrollEl.scrollTop <= 15) return { isTop: true };
      const sRect = scrollEl.getBoundingClientRect();
      const targetY = sRect.top + 70;
      const candidates = scrollEl.querySelectorAll('.script-block-container, .script-editable-content p');
      for (let i = 0; i < candidates.length; i++) {
        const el = candidates[i];
        const r = el.getBoundingClientRect();
        if (r.bottom >= targetY) {
          return { isTop: false, el, offsetFromTop: r.top - sRect.top };
        }
      }
      return null;
    }

    function restoreScriptScrollAnchor(anchor) {
      if (!anchor) return;
      const scrollEl = document.getElementById('scriptReaderScroll');
      if (!scrollEl) return;
      if (anchor.isTop) {
        scrollEl.scrollTop = 1;
        return;
      }
      if (!anchor.el || !anchor.el.isConnected) return;
      const sRect = scrollEl.getBoundingClientRect();
      const newRect = anchor.el.getBoundingClientRect();
      const diff = (newRect.top - sRect.top) - anchor.offsetFromTop;
      if (Math.abs(diff) > 0.5) {
        scrollEl.scrollTop += diff;
      }
    }

    function applyScriptFontSize(newSize) {
      const anchor = captureScriptScrollAnchor();
      scriptFontSize = newSize;
      const paper = document.getElementById('scriptPaperContainer');
      if (paper) {
        paper.style.fontSize = `${scriptFontSize}px`;
        void paper.offsetHeight;
      }
      updateFontResetBtnUI();
      initAllScriptCanvases();
      restoreScriptScrollAnchor(anchor);
      requestAnimationFrame(() => {
        restoreScriptScrollAnchor(anchor);
      });
    }

    function adjustScriptFontSize(delta) {
      const target = Math.min(26, Math.max(12, scriptFontSize + delta));
      if (target !== scriptFontSize) {
        applyScriptFontSize(target);
      }
    }

    function resetScriptFontSize() {
      applyScriptFontSize(16);
    }

    function closeScriptReader(e) {
      if (e) {
        if (e.preventDefault) e.preventDefault();
        if (e.stopPropagation) e.stopPropagation();
      }

      saveScriptReaderLockState(false, '');
      document.body.classList.remove('script-reader-locked');
      document.body.style.overflow = '';

      const ov = document.getElementById('scriptReaderOverlay');
      if (ov) {
        ov.classList.add('hidden');
        ov.classList.remove('flex');
        ov.style.setProperty('display', 'none', 'important');
      }

      if (modalStack.length > 0 && modalStack[modalStack.length - 1]?.type === 'SCENE') {
        openSceneModal(modalStack[modalStack.length - 1].id, false);
      } else {
        closeModal();
      }
    }

    function getOrCreateScriptPrintMount() {
      let mount = document.getElementById('scriptPrintMount');
      if (!mount) {
        mount = document.createElement('div');
        mount.id = 'scriptPrintMount';
        document.body.appendChild(mount);
      }
      const paper = document.getElementById('scriptPaperContainer');
      mount.style.fontFamily = "'Courier New', Courier, monospace";
      mount.style.fontSize = (paper && paper.style.fontSize) ? paper.style.fontSize : `${scriptFontSize}px`;
      mount.style.lineHeight = '1.55';
      return mount;
    }

    function syncCanvasMirrorOnBlock(blockEl) {
      if (!blockEl) return Promise.resolve();
      const cv = blockEl.querySelector('.script-draw-canvas');
      if (!cv || cv.width <= 0 || cv.height <= 0) return Promise.resolve();
      const itemId = blockEl.getAttribute('data-item-id');
      const project = getCurrentProject();
      const item = project?.items?.find(i => i.id === itemId);
      let img = cv.parentElement.querySelector('.print-canvas-mirror');

      if (!item || !item.strokes || item.strokes.length === 0) {
        if (img) img.remove();
        return Promise.resolve();
      }

      return new Promise((resolve) => {
        try {
          if (!img) {
            img = document.createElement('img');
            img.className = 'print-canvas-mirror pointer-events-none';
            cv.parentElement.appendChild(img);
          }
          img.onload = () => resolve();
          img.onerror = () => resolve();
          img.src = cv.toDataURL('image/png');
          if (img.complete) resolve();
        } catch (e) {
          resolve();
        }
      });
    }

function cloneBlockForPrint(blockEl) {
      const clone = blockEl.cloneNode(true);
      clone.removeAttribute('id');
      clone.querySelectorAll('[id]').forEach(el => el.removeAttribute('id'));

      clone.querySelectorAll('p').forEach(p => {
        const txt = p.textContent.trim();
        if (/^\d+\/\d+\s+(EXT\.|INT\.)/i.test(txt)) {
          p.style.fontWeight = '900';
          p.style.setProperty('font-weight', '900', 'important');
          if (!p.querySelector('strong')) {
            p.innerHTML = `<strong style="font-weight: 900 !important;">${p.innerHTML}</strong>`;
          }
        }
      });

      const origTas = blockEl.querySelectorAll('textarea');
      const cloneTas = clone.querySelectorAll('textarea');
      origTas.forEach((ta, idx) => {
        const cTa = cloneTas[idx];
        if (cTa) {
          const div = document.createElement('div');
          div.className = cTa.className;
          div.style.cssText = cTa.style.cssText;
          div.style.whiteSpace = 'pre-wrap';
          div.style.wordBreak = 'break-word';
          div.textContent = ta.value;
          cTa.replaceWith(div);
        }
      });
      return clone;
    }

              <span>Tlačiť (Vytvoriť PDF)</span>

        <div id="pdfPreviewScroll" class="flex-1 overflow-y-auto overflow-x-hidden p-4 sm:p-8 flex flex-col items-center">
          <div id="pdfPreviewViewportScaler" class="origin-top transition-transform duration-150 flex flex-col items-center">

      `;
      document.body.appendChild(ov);
      window.addEventListener('resize', updatePdfViewportResponsiveness);
      return ov;

    function updatePdfViewportResponsiveness() {
      const ov = document.getElementById('pdfPreviewOverlay');
      if (!ov || ov.classList.contains('hidden')) return;
      const scrollEl = document.getElementById('pdfPreviewScroll');
      const scaler = document.getElementById('pdfPreviewViewportScaler');
      const paperWrap = document.getElementById('pdfPreviewPaper');
      if (!scrollEl || !scaler || !paperWrap) return;

      const availW = scrollEl.clientWidth - 24;
      const scale = Math.min(1, availW / A4_WIDTH_PX);
      scaler.style.transform = `scale(${scale})`;
      scaler.style.height = `${paperWrap.offsetHeight * scale + 40}px`;
    }

    function paginateContentIntoA4Pages() {
      const paperWrap = document.getElementById('pdfPreviewPaper');
      const buffer = document.getElementById('pdfMeasureBuffer');
      const badge = document.getElementById('pdfPreviewPageBadge');
      const label = document.getElementById('pdfPreviewScaleLabel');

      if (!paperWrap || !buffer) return;

      buffer.style.fontSize = `${pdfPreviewFontSize}px`;
      buffer.style.lineHeight = pdfPreviewFontSize < 14 ? '1.38' : '1.52';
      if (label) label.textContent = `${pdfPreviewFontSize}px`;

      buffer.innerHTML = '';
      originalPrintBlocks.forEach(block => {
        const cloned = cloneBlockForPrint(block);
        const annot = cloned.querySelector('.script-annot-area');
        if (annot) {
          annot.classList.remove('py-6', 'sm:py-10', 'px-5', 'sm:px-14');
          annot.style.padding = '8px 4px';
        }
        buffer.appendChild(cloned);
      });

      const gapPx = Math.max(4, Math.round((pdfPreviewFontSize / 16) * 14));
      buffer.querySelectorAll('.script-editable-content').forEach(el => {
        el.style.marginTop = '0px';
        const pList = el.querySelectorAll('p');
        pList.forEach((p, idx) => {
          if (idx > 0 && !p.style.marginTop) {
            p.style.marginTop = `${gapPx}px`;
          }
        });
      });

      const totalH = buffer.scrollHeight || buffer.offsetHeight || 1;
      const bufferRect = buffer.getBoundingClientRect();
      const paragraphs = Array.from(buffer.querySelectorAll('p'));

      const slices = [];
      let curStart = 0;

      while (curStart < totalH - 4) {
        let nextEnd = curStart + USABLE_H;
        if (nextEnd >= totalH - 4) {
          slices.push({ startY: curStart, height: Math.min(USABLE_H, totalH - curStart) });
          break;
        }

        let adjustedEnd = nextEnd;
        for (let i = 0; i < paragraphs.length; i++) {
          const r = paragraphs[i].getBoundingClientRect();
          const pTop = r.top - bufferRect.top;
          const pBottom = r.bottom - bufferRect.top;
          if (pTop > curStart + 40 && pTop < nextEnd && pBottom > nextEnd) {
            adjustedEnd = Math.floor(pTop);
            break;
          }
        }

        const sliceH = Math.max(100, adjustedEnd - curStart);
        slices.push({ startY: curStart, height: sliceH });
        curStart += sliceH;
      }

      if (slices.length === 0) {
        slices.push({ startY: 0, height: USABLE_H });
      }

      paperWrap.innerHTML = '';
      slices.forEach(slice => {
        const page = createA4PageDiv();
        const viewport = document.createElement('div');
        viewport.style.position = 'relative';
        viewport.style.width = '100%';
        viewport.style.height = `${slice.height}px`;
        viewport.style.overflow = 'hidden';

        const shifted = document.createElement('div');
        shifted.style.position = 'relative';
        shifted.style.width = '100%';
        shifted.style.transform = `translateY(-${slice.startY}px)`;
        shifted.innerHTML = buffer.innerHTML;

        viewport.appendChild(shifted);
        page.appendChild(viewport);
        paperWrap.appendChild(page);
      });

      const pageCount = slices.length;
      if (badge) {
        badge.textContent = pageCount === 1 ? '1 strana A4' : (pageCount >= 2 && pageCount <= 4 ? `${pageCount} strany A4` : `${pageCount} strán A4`);
      }

      updatePdfViewportResponsiveness();
    }

    function createA4PageDiv() {
      const page = document.createElement('div');
      page.className = 'a4-pdf-page';
      page.style.fontSize = `${pdfPreviewFontSize}px`;
      page.style.lineHeight = pdfPreviewFontSize < 14 ? '1.38' : '1.52';
      return page;
    }

    function adjustPdfPreviewSize(delta) {
      pdfPreviewFontSize = Math.min(22, Math.max(9, pdfPreviewFontSize + delta));
      paginateContentIntoA4Pages();

    async function openPdfPrintPreview(blocks, titleText) {
