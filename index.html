        },
        {
          id: 'ERASER',
          label: 'Guma',
          icon: `<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M18.364 8.636l-8.486 8.486a2 2 0 01-2.828 0L3.515 13.586a2 2 0 010-2.828l8.486-8.486a2 2 0 012.828 0l3.535 3.536a2 2 0 010 2.828zM6.343 16.414l5.657-5.657M3 21h18"/></svg>`
        },
        {
          id: 'TEXT',
          label: 'Písať text',
          icon: `<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 6h14M12 6v13m-2.5 0h5"/></svg>`
        },
        {
          id: 'STICKY',
          label: 'Štítok',
          icon: `<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 3H5a2 2 0 00-2 2v14a2 2 0 002 2h9l6-6V5a2 2 0 00-2-2zM14 15v6l6-6h-6z"/></svg>`
        }
      ];

      const colors = [
        { hex: '#ef4444', name: 'Červená' },
        { hex: '#facc15', name: 'Žltá' },
        { hex: '#3b82f6', name: 'Modrá' },
        { hex: '#22c55e', name: 'Zelená' },
        { hex: '#18181b', name: 'Čierna' }
      ];

      const sizes = [
        { val: 2, label: 'Tenké / Malá guma', dot: 'w-1.5 h-1.5' },
        { val: 4, label: 'Stredné / 3 cm guma', dot: 'w-2.5 h-2.5' },
        { val: 7, label: 'Hrubé / 6 cm guma', dot: 'w-3.5 h-3.5' }
      ];

      const canUndo = scriptUndoStack.length > 0;
      const canRedo = scriptRedoStack.length > 0;

      wrap.innerHTML = `
        <div class="flex items-center gap-1.5 shrink-0">
          ${tools.map(t => {
            const active = scriptToolState.mode === t.id;
            return `
              <button
                onclick="setScriptToolMode('${t.id}')"
                title="${t.label}"
                class="w-9 h-9 rounded-xl flex items-center justify-center transition shrink-0 ${
                  active ? 'bg-amber-500 text-zinc-950 shadow-xs' : 'bg-zinc-800 text-zinc-300 hover:bg-zinc-700'
                }"
              >
                ${t.icon}
              </button>
            `;
          }).join('')}

          <div class="flex items-center gap-1 pl-1.5 ml-0.5 border-l border-zinc-800">
            <button
              id="scriptUndoBtn"
              onclick="undoScriptStroke()"
              ${!canUndo ? 'disabled' : ''}
              title="Späť (Undo)"
              class="w-9 h-9 rounded-xl flex items-center justify-center transition shrink-0 ${
                canUndo ? 'bg-zinc-800 text-zinc-200 hover:bg-amber-500 hover:text-zinc-950' : 'bg-zinc-800/40 text-zinc-600 cursor-not-allowed'
              }"
            >
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6"/></svg>
            </button>
            <button
              id="scriptRedoBtn"
              onclick="redoScriptStroke()"
              ${!canRedo ? 'disabled' : ''}
              title="Dopredu (Redo)"
              class="w-9 h-9 rounded-xl flex items-center justify-center transition shrink-0 ${
                canRedo ? 'bg-zinc-800 text-zinc-200 hover:bg-amber-500 hover:text-zinc-950' : 'bg-zinc-800/40 text-zinc-600 cursor-not-allowed'
              }"
            >
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 10h-10a8 8 0 00-8 8v2M21 10l-6 6m6-6l-6-6"/></svg>
            </button>
          </div>
        </div>

        <div class="flex items-center gap-3 shrink-0 pl-2 border-l border-zinc-800">
          <div class="flex items-center gap-1.5">
            ${colors.map(c => {
              const active = scriptToolState.color === c.hex;
              return `
                <button
                  onclick="setScriptToolColor('${c.hex}')"
                  title="${c.name}"
                  class="w-6 h-6 rounded-full border-2 transition transform ${active ? 'scale-110 border-white ring-2 ring-amber-500/50' : 'border-zinc-700 opacity-75 hover:opacity-100'}"
                  style="background-color: ${c.hex};"
                ></button>
              `;
            }).join('')}
          </div>

          <div class="flex items-center gap-1 bg-zinc-800 p-1 rounded-xl">
            ${sizes.map(s => {
              const active = scriptToolState.size === s.val;
              return `
                <button
                  onclick="setScriptToolSize(${s.val})"
                  title="${s.label}"
                  class="w-6 h-6 rounded-lg flex items-center justify-center transition ${active ? 'bg-amber-500 text-zinc-950' : 'text-zinc-300 hover:bg-zinc-700'}"
                >
                  <span class="${s.dot} rounded-full bg-current"></span>
                </button>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    function setScriptToolMode(mode) {
      scriptToolState.mode = mode;
      if (mode === 'HIGHLIGHT' && scriptToolState.color === '#18181b') {
        scriptToolState.color = '#facc15';
      }
      renderScriptToolbar();
      applyScriptToolModeToDOM();
    }

    function setScriptToolColor(hex) {
      scriptToolState.color = hex;
      if (scriptToolState.mode === 'READ' || scriptToolState.mode === 'ERASER') {
        scriptToolState.mode = 'PEN';
      }
      renderScriptToolbar();
      applyScriptToolModeToDOM();
    }

    function setScriptToolSize(sz) {
      scriptToolState.size = sz;
      if (scriptToolState.mode === 'READ') {
        scriptToolState.mode = 'PEN';
      }
      renderScriptToolbar();
      applyScriptToolModeToDOM();
    }

    function applyScriptToolModeToDOM() {
      const isDrawing = ['PEN', 'HIGHLIGHT', 'ERASER'].includes(scriptToolState.mode);
      const isText = scriptToolState.mode === 'TEXT';
      const isSticky = scriptToolState.mode === 'STICKY';

      const scrollCont = document.getElementById('scriptReaderScroll');
      if (scrollCont) {
        if (isDrawing) {
          scrollCont.style.touchAction = 'none';
          scrollCont.style.overflowY = 'hidden';
        } else {
          scrollCont.style.touchAction = 'pan-y';
          scrollCont.style.overflowY = 'auto';
        }
      }

      const paperCont = document.getElementById('scriptPaperContainer');
      if (paperCont) {
        if (isDrawing) {
          paperCont.style.touchAction = 'none';
          paperCont.style.userSelect = 'none';
          paperCont.style.webkitUserSelect = 'none';
        } else {
          paperCont.style.touchAction = '';
          paperCont.style.userSelect = '';
          paperCont.style.webkitUserSelect = '';
        }
      }

      document.querySelectorAll('[id^="sticky-dom-"]').forEach(stEl => {
        stEl.style.pointerEvents = isDrawing ? 'none' : 'auto';
      });

      document.querySelectorAll('.script-draw-canvas').forEach(cv => {
        if (isDrawing) {
          cv.style.pointerEvents = 'auto';
          cv.style.touchAction = 'none';
          cv.style.cursor = scriptToolState.mode === 'ERASER' ? 'cell' : 'crosshair';
        } else {
          cv.style.pointerEvents = 'none';
          cv.style.touchAction = 'auto';
          cv.style.cursor = 'default';
        }
      });

      document.querySelectorAll('.script-editable-content').forEach(el => {
        if (isText) {
          el.setAttribute('contenteditable', 'true');
          el.classList.add('ring-2', 'ring-amber-500/40', 'bg-amber-500/5', 'rounded-lg', 'p-2', '-m-2');
          el.style.cursor = 'text';
          el.style.userSelect = 'text';
          el.style.webkitUserSelect = 'text';
        } else {
          el.removeAttribute('contenteditable');
          el.classList.remove('ring-2', 'ring-amber-500/40', 'bg-amber-500/5', 'rounded-lg', 'p-2', '-m-2');
          el.style.cursor = isSticky ? 'copy' : 'default';
          el.style.userSelect = isDrawing ? 'none' : '';
          el.style.webkitUserSelect = isDrawing ? 'none' : '';
        }
      });
    }

    function formatScriptLinesHTML(rawDetails) {
      const lines = String(rawDetails || '').split(/\s*\|\|\s*/);
      return lines.map(line => {
        let safe = escapeHtml(line)
          .replace(/&lt;b&gt;(.*?)&lt;\/b&gt;/g, '<strong>$1</strong>')
          .replace(/&lt;u&gt;(.*?)&lt;\/u&gt;/g, '<span class="underline">$1</span>');
        if (/^(Grafika|VO)/i.test(line.replace(/<\/?b>/g, ''))) {
          return `<p class="py-1 px-2.5 rounded bg-amber-500/10 border-l-2 border-amber-500">${safe}</p>`;
        }
        return `<p>${safe}</p>`;
      }).join('');
    }

    let lastDrawingActivityTime = 0;

    function saveScriptReaderLockState(isOpen, sceneCode = '') {
      try {
        const scrollEl = document.getElementById('scriptReaderScroll');
        localStorage.setItem('script_reader_lock_v1', JSON.stringify({
          open: !!isOpen,
          project: appState.activeProject,
          scene: sceneCode,
          scrollTop: scrollEl ? scrollEl.scrollTop : 0
        }));
      } catch (e) {}
    }

    function initScriptReaderLockGuards() {
      const ov = document.getElementById('scriptReaderOverlay');
      const scrollEl = document.getElementById('scriptReaderScroll');
      if (!ov || ov.dataset.lockGuardBound === '1') return;
      ov.dataset.lockGuardBound = '1';

      const preventSystemGesture = (e) => {
        if (e.cancelable) e.preventDefault();
        e.stopPropagation();
      };

      ov.addEventListener('gesturestart', preventSystemGesture, { passive: false });
      ov.addEventListener('gesturechange', preventSystemGesture, { passive: false });
      ov.addEventListener('gestureend', preventSystemGesture, { passive: false });

      ov.addEventListener('touchstart', (e) => {
        if (e.touches && e.touches.length > 1) {
          if (e.cancelable) e.preventDefault();
        }
      }, { passive: false });

      ov.addEventListener('pointerdown', (e) => {
        if (e.pointerType === 'pen') {
          lastDrawingActivityTime = Date.now();
        }
      }, { capture: true });

      if (scrollEl) {
        scrollEl.addEventListener('scroll', () => {
          if (!ov.classList.contains('hidden')) {
            saveScriptReaderLockState(true, document.getElementById('scriptJumpSelect')?.value || '');
          }
        }, { passive: true });
      }

      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') {
          restoreScriptReaderIfLocked();
        }
      });

      window.addEventListener('pageshow', () => {
        restoreScriptReaderIfLocked();
      });
    }

    function restoreScriptReaderIfLocked() {
      try {
        const raw = localStorage.getItem('script_reader_lock_v1');
        if (!raw) return;
        const lock = JSON.parse(raw);
        if (!lock || !lock.open) return;
        const ov = document.getElementById('scriptReaderOverlay');
        if (ov && ov.classList.contains('hidden')) {
          openScriptReader(lock.scene || '', lock.scrollTop || 0);
        }
      } catch (e) {}
    }

    function openScriptReader(targetSceneCode = '', restoreScrollTop = null) {
      const project = getCurrentProject();
      const scriptItems = project.items.filter(i => i.group === 'SCRIPT');
      if (scriptItems.length === 0) {
        alert('V tomto výrobnom liste zatiaľ nie sú nahraté riadky scenára.');
        return;
      }

      initScriptReaderLockGuards();

      const jumpSelect = document.getElementById('scriptJumpSelect');
      jumpSelect.innerHTML = scriptItems.map((it, idx) => {
        const scCode = (it.scenesRaw || `UVOD_${idx}`).trim();
        return `<option value="${escapeHtml(scCode)}" ${scCode === targetSceneCode ? 'selected' : ''}>${escapeHtml(it.title)}</option>`;
      }).join('');

      renderScriptToolbar();
      renderScriptPaperBlocks();

      const ov = document.getElementById('scriptReaderOverlay');
      ov.classList.remove('hidden');
      ov.classList.add('flex');
      document.body.style.overflow = 'hidden';

      saveScriptReaderLockState(true, targetSceneCode);

      setTimeout(() => {
        initAllScriptCanvases();
        fitAllStickyTextareas();
        applyScriptToolModeToDOM();
        if (typeof restoreScrollTop === 'number' && restoreScrollTop > 0) {
          document.getElementById('scriptReaderScroll').scrollTop = restoreScrollTop;
        } else if (targetSceneCode) {
          scrollToScriptScene(targetSceneCode);
        } else {
          document.getElementById('scriptReaderScroll').scrollTop = 0;
        }
      }, 50);
    }

    function renderScriptPaperBlocks() {
      const project = getCurrentProject();
      const scriptItems = project.items.filter(i => i.group === 'SCRIPT');
      const paper = document.getElementById('scriptPaperContainer');

      paper.innerHTML = scriptItems.map((it, idx) => {
        const scCode = (it.scenesRaw || '').trim();
        const anchorId = `script-anchor-${scCode || ('UVOD_' + idx)}`;
        const isDone = scCode ? !!project.sceneDone?.[scCode] : false;
        const innerHtmlContent = it.customHtml || formatScriptLinesHTML(it.details);
        const stickyList = it.stickyNotes || [];

        return `
          <div
            id="${escapeHtml(anchorId)}"
            data-item-id="${escapeHtml(it.id)}"
            data-scene-code="${escapeHtml(scCode)}"
            class="script-block-container relative border-b border-zinc-300/80 dark:border-zinc-800 last:border-none transition-all duration-300 ${isDone ? 'opacity-40 grayscale script-done-cross-always-black' : ''}"
          >
            ${scCode ? `
              <div class="px-5 sm:px-14 pt-6 pb-2 relative z-30 flex items-center gap-2">
                <button onclick="event.stopPropagation(); toggleSceneDoneInScript('${escapeHtml(scCode)}')" class="flex-1 px-4 py-3 rounded-xl font-extrabold text-sm sm:text-base transition flex items-center justify-between shadow-xs ${
                  isDone ? 'bg-emerald-500 text-zinc-950' : 'bg-amber-500 text-zinc-950 hover:bg-amber-400'
                }">
                  <span>Obraz ${escapeHtml(scCode)}</span>
                  <span class="flex items-center gap-1.5 text-xs sm:text-sm">
                    ${isDone ? `${ICONS.check} <span>Natočené</span>` : '<span>Označiť ako natočené</span>'}
                  </span>
                </button>
                ${(it.strokes && it.strokes.length > 0) ? `
                  <button onclick="event.stopPropagation(); clearSceneStrokes('${escapeHtml(it.id)}')" title="Vymazať kresby v tomto obraze" class="px-3 py-3 rounded-xl bg-zinc-200 hover:bg-rose-500 hover:text-white text-zinc-700 text-xs font-bold transition shrink-0">
                    Čistiť kresbu
                  </button>
                ` : ''}
              </div>
            ` : ''}

            <div
              id="script-annot-area-${escapeHtml(it.id)}"
              onclick="handleScriptBlockClick(event, '${escapeHtml(it.id)}')"
              class="script-annot-area relative px-5 sm:px-14 py-6 sm:py-10"
            >
              <div
                id="script-text-${escapeHtml(it.id)}"
                onblur="saveScriptEditableText('${escapeHtml(it.id)}', this)"
                class="script-editable-content space-y-3.5 relative z-10 focus:outline-none"
              >${innerHtmlContent}</div>

              <canvas
                id="script-canvas-${escapeHtml(it.id)}"
                data-item-id="${escapeHtml(it.id)}"
                class="script-draw-canvas absolute inset-0 z-20 pointer-events-none select-none"
              ></canvas>

              <div id="script-stickies-${escapeHtml(it.id)}" class="absolute inset-0 z-30 pointer-events-none">
                ${stickyList.map(st => renderSingleStickyHTML(it.id, st)).join('')}
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function getStickyDynamicFontSize(text) {
      const len = (text || '').trim().length;
      if (len <= 2) return '52px';
      if (len <= 5) return '40px';
      if (len <= 10) return '30px';
      if (len <= 18) return '24px';
      if (len <= 30) return '19px';
      if (len <= 50) return '15px';
      if (len <= 80) return '13px';
      return '11px';
    }

    function autoFitStickyText(ta) {
      if (!ta) return;
      ta.style.fontSize = getStickyDynamicFontSize(ta.value);
      ta.style.height = '0px';
      ta.style.height = (ta.scrollHeight + 4) + 'px';
    }

    function fitAllStickyTextareas() {
      document.querySelectorAll('[id^="sticky-text-"]').forEach(ta => {
        autoFitStickyText(ta);
      });
    }

    function renderSingleStickyHTML(itemId, st) {
      const bgMap = {
        '#ef4444': 'bg-rose-100 border-rose-400 text-rose-950',
        '#facc15': 'bg-amber-100 border-amber-400 text-amber-950',
        '#3b82f6': 'bg-sky-100 border-sky-400 text-sky-950',
        '#22c55e': 'bg-emerald-100 border-emerald-400 text-emerald-950',
        '#18181b': 'bg-zinc-200 border-zinc-500 text-zinc-950'
      };
      const colorCls = bgMap[st.color] || bgMap['#facc15'];
      const dynamicSize = getStickyDynamicFontSize(st.text);

      return `
        <div
          id="sticky-dom-${escapeHtml(st.id)}"
          style="left: ${st.x}%; top: ${st.y}px; touch-action: none; -webkit-user-select: none; user-select: none;"
          onclick="event.stopPropagation()"
          onpointerdown="handleStickyPointerDown(event, '${escapeHtml(itemId)}', '${escapeHtml(st.id)}')"
          class="pointer-events-auto absolute w-48 sm:w-56 min-h-[115px] rounded-2xl border-2 shadow-lg p-3 flex items-center justify-center transition-shadow hover:shadow-2xl group cursor-move select-none ${colorCls}"
          title="Ťahaním posuniete • Ťuknutím píšete"
        >
          <textarea
            id="sticky-text-${escapeHtml(st.id)}"
            rows="1"
            onfocus="onStickyFocus('${escapeHtml(itemId)}', '${escapeHtml(st.id)}', this)"
            onblur="onStickyBlur('${escapeHtml(itemId)}', '${escapeHtml(st.id)}', this)"
            oninput="handleStickyInput('${escapeHtml(itemId)}', '${escapeHtml(st.id)}', this)"
            placeholder="..."
            class="w-full bg-transparent font-extrabold leading-tight focus:outline-none resize-none overflow-hidden cursor-move pointer-events-none text-center m-auto"
            style="font-family: 'Plus Jakarta Sans', sans-serif; font-size: ${dynamicSize};"
          >${escapeHtml(st.text || '')}</textarea>
          
          <button
            id="sticky-del-${escapeHtml(st.id)}"
            onpointerdown="event.stopPropagation()"
            onclick="event.stopPropagation(); deleteStickyNote('${escapeHtml(itemId)}', '${escapeHtml(st.id)}')"
            class="hidden absolute -top-2.5 -right-2.5 w-6 h-6 rounded-full bg-zinc-900 text-white text-xs font-extrabold items-center justify-center transition shadow-md cursor-pointer z-20"
          >×</button>
        </div>
      `;
    }

    function activateStickyText(e, stickyId) {
      if (e && e.stopPropagation) e.stopPropagation();
      const ta = document.getElementById(`sticky-text-${stickyId}`);
      const delBtn = document.getElementById(`sticky-del-${stickyId}`);
      if (ta) {
        ta.classList.remove('pointer-events-none', 'cursor-move');
        ta.classList.add('cursor-text');
        autoFitStickyText(ta);
        ta.focus();
      }
      if (delBtn) {
        delBtn.classList.remove('hidden');
        delBtn.classList.add('flex');
      }
    }

    let stickyOldTextBeforeEdit = '';
    function onStickyFocus(itemId, stickyId, ta) {
      stickyOldTextBeforeEdit = ta.value;
    }

    function onStickyBlur(itemId, stickyId, ta) {
      ta.classList.add('pointer-events-none', 'cursor-move');
      ta.classList.remove('cursor-text');
      const delBtn = document.getElementById(`sticky-del-${stickyId}`);
      if (delBtn) {
        setTimeout(() => {
          delBtn.classList.add('hidden');
          delBtn.classList.remove('flex');
        }, 120);
      }
      if (ta.value !== stickyOldTextBeforeEdit) {
        pushScriptAction({
          type: 'STICKY_EDIT',
          itemId,
          stickyId,
          oldText: stickyOldTextBeforeEdit,
          newText: ta.value
        });
      }
    }

    function handleStickyPointerDown(e, itemId, stickyId) {
      if (e.target.closest('button')) return;
      const ta = document.getElementById(`sticky-text-${stickyId}`);
      if (ta && document.activeElement === ta) return;
      startDragSticky(e, itemId, stickyId);
    }

    function saveScriptEditableText(itemId, el) {
      const project = getCurrentProject();
      const item = project.items.find(i => i.id === itemId);
      if (!item) return;
      item.customHtml = el.innerHTML;
      const paragraphs = Array.from(el.querySelectorAll('p')).map(p => p.innerText.trim()).filter(Boolean);
      if (paragraphs.length > 0) {
        item.details = paragraphs.join(' || ');
      }
      saveState();
      renderApp();
    }

    let drawingSaveTimer = null;
    function scheduleDrawingSaveState() {
      if (drawingSaveTimer) clearTimeout(drawingSaveTimer);
      drawingSaveTimer = setTimeout(() => {
        drawingSaveTimer = null;
        saveState();
      }, 650);
    }

    function updateUndoRedoButtonsUI() {
      const undoBtn = document.getElementById('scriptUndoBtn');
      const redoBtn = document.getElementById('scriptRedoBtn');
      const canUndo = scriptUndoStack.length > 0;
      const canRedo = scriptRedoStack.length > 0;
      const activeCls = ['bg-zinc-800', 'text-zinc-200', 'hover:bg-amber-500', 'hover:text-zinc-950'];
      const disabledCls = ['bg-zinc-800/40', 'text-zinc-600', 'cursor-not-allowed'];

      if (undoBtn) {
        undoBtn.disabled = !canUndo;
        undoBtn.classList.remove(...activeCls, ...disabledCls);
        undoBtn.classList.add(...(canUndo ? activeCls : disabledCls));
      }
      if (redoBtn) {
        redoBtn.disabled = !canRedo;
        redoBtn.classList.remove(...activeCls, ...disabledCls);
        redoBtn.classList.add(...(canRedo ? activeCls : disabledCls));
      }
    }

    function pushScriptAction(action) {
      scriptUndoStack.push(action);
      scriptRedoStack = [];
      updateUndoRedoButtonsUI();
    }

    function handleScriptBlockClick(e, itemId) {
      if (scriptToolState.mode !== 'STICKY') return;
      const area = document.getElementById(`script-annot-area-${itemId}`);
      if (!area) return;

      const rect = area.getBoundingClientRect();
      const xPct = Math.max(1, Math.min(82, Math.round(((e.clientX - rect.left) / rect.width) * 100)));
      const yPx = Math.max(5, Math.round(e.clientY - rect.top));

      const project = getCurrentProject();
      const item = project.items.find(i => i.id === itemId);
      if (!item) return;
      if (!item.stickyNotes) item.stickyNotes = [];

      const newSticky = {
        id: 'st_' + Date.now(),
        x: xPct,
        y: yPx,
        color: scriptToolState.color,
        text: '',
        minimized: false
      };
      item.stickyNotes.push(newSticky);

      pushScriptAction({
        type: 'STICKY_ADD',
        itemId,
        sticky: JSON.parse(JSON.stringify(newSticky))
      });

      saveState();

      const stickiesWrap = document.getElementById(`script-stickies-${itemId}`);
      if (stickiesWrap) {
        stickiesWrap.innerHTML = item.stickyNotes.map(st => renderSingleStickyHTML(itemId, st)).join('');
      }
      setScriptToolMode('READ');

      setTimeout(() => {
        activateStickyText(null, newSticky.id);
      }, 50);
    }

    function handleStickyInput(itemId, stickyId, ta) {
      autoFitStickyText(ta);
      updateStickyText(itemId, stickyId, ta.value);
    }

    function updateStickyText(itemId, stickyId, val) {
      const project = getCurrentProject();
      const item = project.items.find(i => i.id === itemId);
      const st = item?.stickyNotes?.find(s => s.id === stickyId);
      if (st) {
        st.text = val;
        saveState();
      }
    }

    function deleteStickyNote(itemId, stickyId) {
      const project = getCurrentProject();
      const item = project.items.find(i => i.id === itemId);
      if (!item || !item.stickyNotes) return;
      const st = item.stickyNotes.find(s => s.id === stickyId);
      if (!st) return;

      pushScriptAction({
        type: 'STICKY_DELETE',
        itemId,
        sticky: JSON.parse(JSON.stringify(st))
      });

      item.stickyNotes = item.stickyNotes.filter(s => s.id !== stickyId);
      saveState();
      const stickiesWrap = document.getElementById(`script-stickies-${itemId}`);
      if (stickiesWrap) {
        stickiesWrap.innerHTML = item.stickyNotes.map(s => renderSingleStickyHTML(itemId, s)).join('');
      }
    }

    function startDragSticky(e, itemId, stickyId) {
      e.preventDefault();
      e.stopPropagation();

      const domEl = document.getElementById(`sticky-dom-${stickyId}`);
      const parentEl = document.getElementById(`script-stickies-${itemId}`);
      if (!domEl || !parentEl) return;

      const activePointerId = e.pointerId;
      try {
        domEl.setPointerCapture(activePointerId);
      } catch (err) {}

      const parentRect = parentEl.getBoundingClientRect();
      const startX = e.clientX;
      const startY = e.clientY;

      const project = getCurrentProject();
      const item = project.items.find(i => i.id === itemId);
      const st = item?.stickyNotes?.find(s => s.id === stickyId);
      if (!st) return;

      const origX = st.x;
      const origY = st.y;
      let moved = false;

      domEl.style.zIndex = '999';

      const onMove = (moveEv) => {
        if (moveEv.pointerId !== activePointerId) return;
        moveEv.preventDefault();
        const dxPx = moveEv.clientX - startX;
        const dyPx = moveEv.clientY - startY;

        if (!moved && Math.hypot(dxPx, dyPx) > 6) {
          moved = true;
          if (document.activeElement && document.activeElement.tagName === 'TEXTAREA') {
            document.activeElement.blur();
          }
        }

        if (moved) {
          const dxPct = (dxPx / (parentRect.width || 600)) * 100;
          st.x = Math.max(-5, Math.min(88, Math.round(origX + dxPct)));
          st.y = Math.round(origY + dyPx);
          domEl.style.left = `${st.x}%`;
          domEl.style.top = `${st.y}px`;
        }
      };

      const onEnd = (endEv) => {
        if (endEv.pointerId !== activePointerId) return;
        domEl.removeEventListener('pointermove', onMove);
        domEl.removeEventListener('pointerup', onEnd);
        domEl.removeEventListener('pointercancel', onEnd);
        try {
          domEl.releasePointerCapture(activePointerId);
        } catch (err) {}
        domEl.style.zIndex = '';

        if (!moved) {
          activateStickyText(endEv, stickyId);
          return;
        }

        const stickyRect = domEl.getBoundingClientRect();
        const stickyCenterY = stickyRect.top + stickyRect.height / 2;
        let targetItemId = itemId;
        let finalY = st.y;

        document.querySelectorAll('.script-block-container').forEach(block => {
          const bRect = block.getBoundingClientRect();
          if (stickyCenterY >= bRect.top && stickyCenterY <= bRect.bottom) {
            const candidateId = block.getAttribute('data-item-id');
            const candidateArea = document.getElementById(`script-annot-area-${candidateId}`);
            if (candidateId && candidateArea) {
              targetItemId = candidateId;
              const areaRect = candidateArea.getBoundingClientRect();
              finalY = Math.round(stickyRect.top - areaRect.top);
            }
          }
        });

        if (targetItemId !== itemId) {
          const targetItem = project.items.find(i => i.id === targetItemId);
          if (targetItem) {
            item.stickyNotes = item.stickyNotes.filter(s => s.id !== stickyId);
            if (!targetItem.stickyNotes) targetItem.stickyNotes = [];
            st.y = finalY;
            targetItem.stickyNotes.push(st);
            refreshStickiesDOM(itemId);
            refreshStickiesDOM(targetItemId);
          }
        }

        pushScriptAction({
          type: 'STICKY_MOVE',
          itemId,
          targetItemId,
          stickyId,
          from: { x: origX, y: origY },
          to: { x: st.x, y: st.y }
        });
        saveState();
      };

      domEl.addEventListener('pointermove', onMove);
      domEl.addEventListener('pointerup', onEnd);
      domEl.addEventListener('pointercancel', onEnd);
    }

    function initAllScriptCanvases() {
      const project = getCurrentProject();
      document.querySelectorAll('.script-draw-canvas').forEach(canvas => {
        const itemId = canvas.getAttribute('data-item-id');
        const area = document.getElementById(`script-annot-area-${itemId}`) || canvas.parentElement;
        if (!area) return;

        canvas.style.width = '0px';
        canvas.style.height = '0px';

        const w = area.offsetWidth || 768;
        const h = area.offsetHeight || 200;
        canvas.width = w;
        canvas.height = h;
        canvas.style.width = w + 'px';
        canvas.style.height = h + 'px';

        const item = project.items.find(i => i.id === itemId);
        redrawCanvasStrokes(canvas, item?.strokes || []);
        bindCanvasDrawingEvents(canvas, itemId);
      });
    }

    function getEraserPixelWidth(sizeVal) {
      if (sizeVal >= 7) return 230;
      if (sizeVal >= 4) return 115;
      return 24;
    }

    function getPenPressureWidth(baseSize, pressure) {
      const p = (typeof pressure === 'number' && pressure > 0) ? pressure : 0.3;
      const clamped = Math.max(0.02, Math.min(1, p));
      const factor = 0.2 + Math.pow(clamped, 1.75) * 6.4;
      return Math.max(0.5, Math.round(baseSize * factor * 10) / 10);
    }

    function applyStrokeStyleToContext(ctx, stroke) {
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      if (stroke.mode === 'ERASER') {
        ctx.globalCompositeOperation = 'destination-out';
        ctx.globalAlpha = 1;
        ctx.lineWidth = getEraserPixelWidth(stroke.size);
        ctx.strokeStyle = 'rgba(0,0,0,1)';
      } else if (stroke.mode === 'HIGHLIGHT') {
        ctx.globalCompositeOperation = 'source-over';
        ctx.globalAlpha = 0.35;
        ctx.lineWidth = stroke.size * 4.5;
        ctx.strokeStyle = stroke.color;
      } else {
        ctx.globalCompositeOperation = 'source-over';
        ctx.globalAlpha = 1;
        ctx.lineWidth = stroke.size;
        ctx.strokeStyle = stroke.color;
      }
    }

    function redrawCanvasStrokes(canvas, strokes) {
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      (strokes || []).forEach(stroke => {
        if (!stroke.points || stroke.points.length === 0) return;
        ctx.save();
        applyStrokeStyleToContext(ctx, stroke);

        if (stroke.mode === 'PEN') {
          if (stroke.points.length === 1) {
            const pt0 = stroke.points[0];
            ctx.lineWidth = getPenPressureWidth(stroke.size, pt0.p);
            ctx.beginPath();
            const px = pt0.x * canvas.width;
            const py = pt0.y * canvas.height;
            ctx.moveTo(px, py);
            ctx.lineTo(px + 0.5, py + 0.5);
            ctx.stroke();
          } else {
            for (let i = 1; i < stroke.points.length; i++) {
              const prev = stroke.points[i - 1];
              const pt = stroke.points[i];
              ctx.lineWidth = getPenPressureWidth(stroke.size, pt.p);
              ctx.beginPath();
              ctx.moveTo(prev.x * canvas.width, prev.y * canvas.height);
              ctx.lineTo(pt.x * canvas.width, pt.y * canvas.height);
              ctx.stroke();
            }
          }
          ctx.restore();
          return;
        }

        ctx.beginPath();
        stroke.points.forEach((pt, idx) => {
          const px = pt.x * canvas.width;
          const py = pt.y * canvas.height;
          if (idx === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        });
        if (stroke.points.length === 1) {
          const px = stroke.points[0].x * canvas.width;
          const py = stroke.points[0].y * canvas.height;
          ctx.lineTo(px + 0.5, py + 0.5);
        }
        ctx.stroke();
        ctx.restore();
      });
    }

    function bindCanvasDrawingEvents(canvas, itemId) {
      if (canvas.dataset.bound === '1') return;
      canvas.dataset.bound = '1';

      let activePointerId = null;
      let activePointerType = null;
      let currentStroke = null;
      let cachedRect = null;
      let lastSmoothedPressure = 0.5;

      const blockTouchIfDrawing = (te) => {
        if (['PEN', 'HIGHLIGHT', 'ERASER'].includes(scriptToolState.mode)) {
          if (te.cancelable) te.preventDefault();
          te.stopPropagation();
        }
      };

      canvas.addEventListener('touchstart', blockTouchIfDrawing, { passive: false });
      canvas.addEventListener('touchmove', blockTouchIfDrawing, { passive: false });
      canvas.addEventListener('touchend', blockTouchIfDrawing, { passive: false });

      const getPosFromRect = (clientX, clientY, r, pressureVal) => {
        const rx = Math.max(0, Math.min(1, (clientX - r.left) / (r.width || 1)));
        const ry = Math.max(0, Math.min(1, (clientY - r.top) / (r.height || 1)));
        return {
          x: Math.round(rx * 10000) / 10000,
          y: Math.round(ry * 10000) / 10000,
          p: Math.round(pressureVal * 1000) / 1000
        };
      };

      canvas.addEventListener('pointerdown', (e) => {
        if (!['PEN', 'HIGHLIGHT', 'ERASER'].includes(scriptToolState.mode)) return;

        if (e.pointerType === 'pen') {
          applePencilActive = true;
        } else if (e.pointerType === 'touch') {
          if (applePencilActive) return;
          if ((e.width && e.width > 20) || (e.height && e.height > 20)) return;
        }

        const project = getCurrentProject();
        const item = project.items.find(i => i.id === itemId);
        if (!item) return;
        if (!item.strokes) item.strokes = [];

        if (activePointerId !== null && activePointerId !== e.pointerId) {
          if (e.pointerType === 'pen' && activePointerType !== 'pen') {
            if (currentStroke && item.strokes[item.strokes.length - 1] === currentStroke) {
              item.strokes.pop();
              redrawCanvasStrokes(canvas, item.strokes);
            }
            activePointerId = null;
            currentStroke = null;
          } else {
            return;
          }
        }

        if (e.cancelable) e.preventDefault();
        e.stopPropagation();

        activePointerId = e.pointerId;
        activePointerType = e.pointerType;
        cachedRect = canvas.getBoundingClientRect();

        const rawP = (e.pointerType === 'pen' && e.pressure > 0) ? e.pressure : 0.5;
        lastSmoothedPressure = rawP;

        const startPt = getPosFromRect(e.clientX, e.clientY, cachedRect, lastSmoothedPressure);
        currentStroke = {
          mode: scriptToolState.mode,
          color: scriptToolState.color,
          size: scriptToolState.size,
          points: [startPt]
        };
        item.strokes.push(currentStroke);

        const ctx = canvas.getContext('2d');
        ctx.save();
        applyStrokeStyleToContext(ctx, currentStroke);
        if (currentStroke.mode === 'PEN') {
          ctx.lineWidth = getPenPressureWidth(currentStroke.size, startPt.p);
        }
        ctx.beginPath();
        const px = startPt.x * canvas.width;
        const py = startPt.y * canvas.height;
        ctx.moveTo(px, py);
        ctx.lineTo(px + 0.5, py + 0.5);
        ctx.stroke();
        ctx.restore();
      }, { passive: false });

      canvas.addEventListener('pointermove', (e) => {
        if (e.pointerId !== activePointerId || !currentStroke) return;
        if (e.cancelable) e.preventDefault();
        e.stopPropagation();

        const r = cachedRect || canvas.getBoundingClientRect();
        const ctx = canvas.getContext('2d');

        if (currentStroke.mode === 'HIGHLIGHT') {
          const pt = getPosFromRect(e.clientX, e.clientY, r, 0.5);
          const prev = currentStroke.points[currentStroke.points.length - 1];
          if (!prev || Math.hypot(pt.x - prev.x, pt.y - prev.y) > 0.002) {
            currentStroke.points.push(pt);
            const project = getCurrentProject();
            const item = project.items.find(i => i.id === itemId);
            if (item) redrawCanvasStrokes(canvas, item.strokes);
          }
          return;
        }

        const events = (typeof e.getCoalescedEvents === 'function') ? e.getCoalescedEvents() : [e];
        ctx.save();
        applyStrokeStyleToContext(ctx, currentStroke);

        events.forEach(ev => {
          const prev = currentStroke.points[currentStroke.points.length - 1];
          const rawP = (e.pointerType === 'pen' && ev.pressure > 0) ? ev.pressure : 0.3;
          lastSmoothedPressure = lastSmoothedPressure * 0.22 + rawP * 0.78;
          const pt = getPosFromRect(ev.clientX, ev.clientY, r, lastSmoothedPressure);

          if (!prev || Math.hypot(pt.x - prev.x, pt.y - prev.y) > 0.0007) {
            currentStroke.points.push(pt);
            if (currentStroke.mode === 'PEN') {
              ctx.lineWidth = getPenPressureWidth(currentStroke.size, pt.p);
            }
            ctx.beginPath();
            ctx.moveTo(prev.x * canvas.width, prev.y * canvas.height);
            ctx.lineTo(pt.x * canvas.width, pt.y * canvas.height);
            ctx.stroke();
          }
        });

        ctx.restore();
      }, { passive: false });

      const finishStroke = (e) => {
        if (e.pointerId !== activePointerId) return;
        activePointerId = null;
        activePointerType = null;
        cachedRect = null;

        if (currentStroke) {
          pushScriptAction({ type: 'STROKE', itemId, stroke: currentStroke });
        }
        currentStroke = null;
        scheduleDrawingSaveState();
      };

      canvas.addEventListener('pointerup', finishStroke);
      canvas.addEventListener('pointercancel', finishStroke);
      canvas.addEventListener('lostpointercapture', finishStroke);
    }

    function undoScriptStroke() {
      if (scriptUndoStack.length === 0) return;
      const act = scriptUndoStack.pop();
      const project = getCurrentProject();
      const item = project.items.find(i => i.id === act.itemId);

      if (act.type === 'STROKE' && item && item.strokes && item.strokes.length > 0) {
        const popped = item.strokes.pop();
        scriptRedoStack.push({ type: 'STROKE', itemId: act.itemId, stroke: popped });
        const canvas = document.getElementById(`script-canvas-${act.itemId}`);
        if (canvas) redrawCanvasStrokes(canvas, item.strokes);
      } else if (act.type === 'STICKY_ADD' && item && item.stickyNotes) {
        item.stickyNotes = item.stickyNotes.filter(s => s.id !== act.sticky.id);
        scriptRedoStack.push(act);
        refreshStickiesDOM(act.itemId);
      } else if (act.type === 'STICKY_DELETE' && item) {
        if (!item.stickyNotes) item.stickyNotes = [];
        item.stickyNotes.push(act.sticky);
        scriptRedoStack.push(act);
        refreshStickiesDOM(act.itemId);
      } else if (act.type === 'STICKY_MOVE') {
        const currentHolderId = act.targetItemId || act.itemId;
        const holderItem = project.items.find(i => i.id === currentHolderId);
        const origItem = project.items.find(i => i.id === act.itemId);
        const st = holderItem?.stickyNotes?.find(s => s.id === act.stickyId);
        if (st && origItem) {
          if (currentHolderId !== act.itemId) {
            holderItem.stickyNotes = holderItem.stickyNotes.filter(s => s.id !== act.stickyId);
            if (!origItem.stickyNotes) origItem.stickyNotes = [];
            origItem.stickyNotes.push(st);
          }
          st.x = act.from.x;
          st.y = act.from.y;
          scriptRedoStack.push(act);
          refreshStickiesDOM(currentHolderId);
          if (currentHolderId !== act.itemId) refreshStickiesDOM(act.itemId);
        }
      } else if (act.type === 'STICKY_EDIT' && item && item.stickyNotes) {
        const st = item.stickyNotes.find(s => s.id === act.stickyId);
        if (st) {
          st.text = act.oldText;
          scriptRedoStack.push(act);
          refreshStickiesDOM(act.itemId);
        }
      }

      saveState();
      renderScriptToolbar();
    }

    function redoScriptStroke() {
      if (scriptRedoStack.length === 0) return;
      const act = scriptRedoStack.pop();
      const project = getCurrentProject();
      const item = project.items.find(i => i.id === act.itemId);

      if (act.type === 'STROKE' && item) {
        if (!item.strokes) item.strokes = [];
        item.strokes.push(act.stroke);
        scriptUndoStack.push(act);
        const canvas = document.getElementById(`script-canvas-${act.itemId}`);
        if (canvas) redrawCanvasStrokes(canvas, item.strokes);
      } else if (act.type === 'STICKY_ADD' && item) {
        if (!item.stickyNotes) item.stickyNotes = [];
        item.stickyNotes.push(act.sticky);
        scriptUndoStack.push(act);
        refreshStickiesDOM(act.itemId);
      } else if (act.type === 'STICKY_DELETE' && item && item.stickyNotes) {
        item.stickyNotes = item.stickyNotes.filter(s => s.id !== act.sticky.id);
        scriptUndoStack.push(act);
        refreshStickiesDOM(act.itemId);
      } else if (act.type === 'STICKY_MOVE') {
        const destId = act.targetItemId || act.itemId;
        const origItem = project.items.find(i => i.id === act.itemId);
        const destItem = project.items.find(i => i.id === destId);
        const st = origItem?.stickyNotes?.find(s => s.id === act.stickyId);
        if (st && destItem) {
          if (destId !== act.itemId) {
            origItem.stickyNotes = origItem.stickyNotes.filter(s => s.id !== act.stickyId);
            if (!destItem.stickyNotes) destItem.stickyNotes = [];
            destItem.stickyNotes.push(st);
          }
          st.x = act.to.x;
          st.y = act.to.y;
          scriptUndoStack.push(act);
          refreshStickiesDOM(act.itemId);
          if (destId !== act.itemId) refreshStickiesDOM(destId);
        }
      } else if (act.type === 'STICKY_EDIT' && item && item.stickyNotes) {
        const st = item.stickyNotes.find(s => s.id === act.stickyId);
        if (st) {
          st.text = act.newText;
          scriptUndoStack.push(act);
          refreshStickiesDOM(act.itemId);
        }
      }

      saveState();
      renderScriptToolbar();
    }

    function refreshStickiesDOM(itemId) {
      const project = getCurrentProject();
      const item = project.items.find(i => i.id === itemId);
      const wrap = document.getElementById(`script-stickies-${itemId}`);
      if (wrap && item) {
        wrap.innerHTML = (item.stickyNotes || []).map(st => renderSingleStickyHTML(itemId, st)).join('');
        fitAllStickyTextareas();
      }
    }

    function clearSceneStrokes(itemId) {
      if (!confirm('Vymazať všetky kresby perom v tomto obraze?')) return;
      const project = getCurrentProject();
      const item = project.items.find(i => i.id === itemId);
      if (item) {
        item.strokes = [];
        scriptUndoStack = scriptUndoStack.filter(a => a.itemId !== itemId);
        scriptRedoStack = scriptRedoStack.filter(a => a.itemId !== itemId);
        saveState();
        renderScriptToolbar();
        renderScriptPaperBlocks();
        setTimeout(() => {
          initAllScriptCanvases();
          applyScriptToolModeToDOM();
        }, 20);
      }
    }

    function toggleSceneDoneInScript(sceneCode) {
      const project = getCurrentProject();
      if (!project.sceneDone) project.sceneDone = {};
      project.sceneDone[sceneCode] = !project.sceneDone[sceneCode];
      saveState();
      renderApp();
      renderScriptPaperBlocks();
      setTimeout(() => {
        initAllScriptCanvases();
        fitAllStickyTextareas();
        applyScriptToolModeToDOM();
      }, 20);
      if (modalStack.length > 0) {
        const top = modalStack[modalStack.length - 1];
        if (top.type === 'SCENE') openSceneModal(top.id, false);
        else if (top.type === 'ITEM') openItemModal(top.id, false);
        else if (top.type === 'MAIN_LOC') openMainLocationModal(top.id, false);
      }
    }

    function scrollToScriptScene(scCode) {
      const el = document.getElementById(`script-anchor-${scCode}`);
      if (el) {
        el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        const sel = document.getElementById('scriptJumpSelect');
        if (sel) sel.value = scCode;
      }
    }

    function updateFontResetBtnUI() {
      const btn = document.getElementById('scriptFontResetBtn');
      if (!btn) return;
      btn.textContent = `${scriptFontSize}px`;
      if (scriptFontSize !== 16) {
        btn.classList.remove('text-zinc-400', 'bg-zinc-800');
        btn.classList.add('bg-amber-500/20', 'text-amber-400', 'border', 'border-amber-500/40');
      } else {
        btn.classList.add('text-zinc-400', 'bg-zinc-800');
        btn.classList.remove('bg-amber-500/20', 'text-amber-400', 'border', 'border-amber-500/40');
      }
    }

    function adjustScriptFontSize(delta) {
      scriptFontSize = Math.min(26, Math.max(12, scriptFontSize + delta));
      const paper = document.getElementById('scriptPaperContainer');
      if (paper) paper.style.fontSize = `${scriptFontSize}px`;
      updateFontResetBtnUI();
      setTimeout(() => initAllScriptCanvases(), 50);
    }

    function resetScriptFontSize() {
      scriptFontSize = 16;
      const paper = document.getElementById('scriptPaperContainer');
      if (paper) paper.style.fontSize = '16px';
      updateFontResetBtnUI();
      setTimeout(() => initAllScriptCanvases(), 50);
    }

    function closeScriptReader() {
      if (Date.now() - lastDrawingActivityTime < 350) return;

      saveScriptReaderLockState(false, '');

      const ov = document.getElementById('scriptReaderOverlay');
      ov.classList.add('hidden');
      ov.classList.remove('flex');
      if (document.getElementById('modalOverlay').classList.contains('hidden')) {
        document.body.style.overflow = '';
      } else if (modalStack.length > 0 && modalStack[modalStack.length - 1].type === 'SCENE') {
        openSceneModal(modalStack[modalStack.length - 1].id, false);
      }
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (document.getElementById('scriptReaderOverlay').classList.contains('hidden')) {
          closeModal();
        }
      }
    });

    loadState();
    if (!localStorage.getItem('theme_manually_toggled')) {
      if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    }
    try {
      history.replaceState({
        activeProject: appState.activeProject,
        activeTab: appState.activeTab,
        locationsSubView: appState.locationsSubView,
        modalStack: []
      }, '');
    } catch (e) {}
    renderApp();
    restoreScriptReaderIfLocked();
  </script>
</body>
</html>
