    function ensureHtml2CanvasReady() {
      if (typeof window.html2canvas === 'function') return Promise.resolve(window.html2canvas);
      return new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
        s.onload = () => resolve(window.html2canvas);
        s.onerror = () => reject(new Error('Nepodarilo sa načítať grafický modul html2canvas.'));
        document.head.appendChild(s);
      });
    }

    function dataUrlToUint8Array(dataUrl) {
      const base64 = dataUrl.split(',')[1];
      const bin = atob(base64);
      const len = bin.length;
      const bytes = new Uint8Array(len);
      for (let i = 0; i < len; i++) {
        bytes[i] = bin.charCodeAt(i);
      }
      return bytes;
    }

    function buildPdfBlobFromJpegPages(pagesData) {
      const enc = new TextEncoder();
      const chunks = [];
      let offset = 0;
      const offsets = [];

      const pushStr = (str) => {
        const b = enc.encode(str);
        chunks.push(b);
        offset += b.length;
      };

      const pushBytes = (b) => {
        chunks.push(b);
        offset += b.length;
      };

      pushStr('%PDF-1.4\n%\xFF\xFF\xFF\xFF\n');

      const numPages = pagesData.length;
      const pageObjIds = [];
      for (let i = 0; i < numPages; i++) {
        pageObjIds.push(3 + i * 3);
      }

      offsets[1] = offset;
      pushStr('1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');

      offsets[2] = offset;
      pushStr(`2 0 obj\n<< /Type /Pages /Kids [${pageObjIds.map(id => `${id} 0 R`).join(' ')}] /Count ${numPages} >>\nendobj\n`);

      const pageW = 595.28;
      const pageH = 841.89;

      for (let i = 0; i < numPages; i++) {
        const p = pagesData[i];
        const pageObjId = 3 + i * 3;
        const contentObjId = 4 + i * 3;
        const imgObjId = 5 + i * 3;

        offsets[pageObjId] = offset;
        pushStr(`${pageObjId} 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pageW} ${pageH}] /Resources << /XObject << /Im0 ${imgObjId} 0 R >> >> /Contents ${contentObjId} 0 R >>\nendobj\n`);

        const contentStream = `q\n${pageW} 0 0 ${pageH} 0 0 cm\n/Im0 Do\nQ\n`;
        offsets[contentObjId] = offset;
        pushStr(`${contentObjId} 0 obj\n<< /Length ${contentStream.length} >>\nstream\n${contentStream}endstream\nendobj\n`);

        offsets[imgObjId] = offset;
        pushStr(`${imgObjId} 0 obj\n<< /Type /XObject /Subtype /Image /Width ${p.width} /Height ${p.height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${p.bytes.length} >>\nstream\n`);
        pushBytes(p.bytes);
        pushStr('\nendstream\nendobj\n');
      }

      const totalObjs = 2 + numPages * 3;
      const xrefOffset = offset;
      pushStr(`xref\n0 ${totalObjs + 1}\n0000000000 65535 f \n`);
      for (let id = 1; id <= totalObjs; id++) {
        const offStr = String(offsets[id]).padStart(10, '0');
        pushStr(`${offStr} 00000 n \n`);
      }

      pushStr(`trailer\n<< /Size ${totalObjs + 1} /Root 1 0 R >>\nstartxref\n${xrefOffset}\n%%EOF`);
      return new Blob(chunks, { type: 'application/pdf' });
    }

    async function generateAndPrintCleanPdf() {
      const btn = document.getElementById('pdfGenerateActionBtn');
      const paperWrap = document.getElementById('pdfPreviewPaper');
      const scaler = document.getElementById('pdfPreviewViewportScaler');
      if (!paperWrap || !btn) return;

      const pages = Array.from(paperWrap.querySelectorAll('.a4-pdf-page'));
      if (pages.length === 0) return;

      const origBtnHtml = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = `<span>Generujem PDF...</span>`;

      const prevTransform = scaler ? scaler.style.transform : '';
      if (scaler) scaler.style.transform = 'none';

      try {
        const html2canvasFn = await ensureHtml2CanvasReady();
        const pagesData = [];

        for (let i = 0; i < pages.length; i++) {
          const pageEl = pages[i];
          const prevShadow = pageEl.style.boxShadow;
          pageEl.style.boxShadow = 'none';

          const canvas = await html2canvasFn(pageEl, {
            scale: 2,
            useCORS: true,
            backgroundColor: '#ffffff',
            logging: false
          });

          pageEl.style.boxShadow = prevShadow;
          const imgData = canvas.toDataURL('image/jpeg', 0.95);
          pagesData.push({
            bytes: dataUrlToUint8Array(imgData),
            width: canvas.width,
            height: canvas.height
          });
        }

        if (scaler) scaler.style.transform = prevTransform;

        const pdfBlob = buildPdfBlobFromJpegPages(pagesData);
        const fileName = `${pdfPreviewTitle}.pdf`;
        const pdfFile = new File([pdfBlob], fileName, { type: 'application/pdf' });

        if (navigator.canShare && navigator.canShare({ files: [pdfFile] })) {
          await navigator.share({
            files: [pdfFile],
            title: fileName
          });
        } else {
          const blobUrl = URL.createObjectURL(pdfBlob);
          window.open(blobUrl, '_blank');
        }
      } catch (err) {
        if (scaler) scaler.style.transform = prevTransform;
        if (err && err.name !== 'AbortError') {
          alert('Chyba pri vytváraní PDF: ' + err.message);
        }
      } finally {
        btn.disabled = false;
        btn.innerHTML = origBtnHtml;
      }
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (document.getElementById('scriptReaderOverlay').classList.contains('hidden')) {
          closeModal();

      }

    loadState();
    if (!localStorage.getItem('theme_manually_toggled')) {
      if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    }
    async function syncDataToGoogleDrive(silent = true) {
      const url = localStorage.getItem('google_drive_script_url');
      if (!url) return;
      const statusEl = document.getElementById('gdriveStatusMsg');
      if (statusEl && !silent) statusEl.textContent = 'Odosielam dáta na Google Drive...';

      try {
        const payload = {
          version: 6,
          exportedAt: new Date().toISOString(),
          activeProject: appState.activeProject,
          projects: appState.projects
        };

        await fetch(url, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (statusEl && !silent) {
          statusEl.textContent = 'Dáta úspešne odoslané na Google Drive!';
          setTimeout(() => { if (statusEl) statusEl.textContent = 'Google Drive je pripojený'; }, 3000);
        }
      } catch (err) {
        if (statusEl && !silent) statusEl.textContent = 'Chyba pri odosielaní: ' + err.message;
      }
    }

    async function syncDataFromGoogleDrive() {
      const url = localStorage.getItem('google_drive_script_url');
      if (!url) return;
      const statusEl = document.getElementById('gdriveStatusMsg');
      if (statusEl) statusEl.textContent = 'Sťahujem dáta z Google Drivu...';

      try {
        const response = await fetch(url);
        const text = await response.text();
        if (!text || text.trim() === '{}') {
          if (statusEl) statusEl.textContent = 'Na Google Drivu zatiaľ nie sú žiadne dáta.';
          return;
        }

        const parsed = JSON.parse(text);
        if (parsed && parsed.projects && Object.keys(parsed.projects).length > 0) {
          appState.projects = parsed.projects;
          if (parsed.activeProject && parsed.projects[parsed.activeProject]) {
            appState.activeProject = parsed.activeProject;
          }
          try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify({
              activeProject: appState.activeProject,
              activeTab: appState.activeTab,
              locationsSubView: appState.locationsSubView,
              lastBackupTime: appState.lastBackupTime,
              projects: appState.projects
            }));
          } catch (e) {}
          renderApp();
          if (statusEl) {
            statusEl.textContent = 'Dáta úspešne stiahnuté z Google Drivu!';
            setTimeout(() => { if (statusEl) statusEl.textContent = 'Google Drive je pripojený'; }, 3000);
          }
        }
      } catch (err) {
        if (statusEl) statusEl.textContent = 'Chyba pri sťahovaní: ' + err.message;
      }
    }

    function saveAndSyncGoogleDrive() {
      const inp = document.getElementById('gscriptUrlInput');
      if (!inp) return;
      const val = inp.value.trim();
      if (!val) {
        alert('Zadajte platnú URL adresu.');
        return;
      }
      localStorage.setItem('google_drive_script_url', val);
      syncDataFromGoogleDrive();
    }

    function testGoogleDriveSync() {
      const inp = document.getElementById('gscriptUrlInput');
      if (!inp) return;
      const val = inp.value.trim();
      if (!val) {
        alert('Zadajte platnú URL adresu.');
        return;
      }
      localStorage.setItem('google_drive_script_url', val);
      syncDataToGoogleDrive(false);
    }

    // Automatické ukladanie do cloudu na pozadí s malým oneskorením
    let gdriveSaveTimer = null;
    const origSaveState = window.saveState || saveState;
    // Prepojíme existujúce saveState tak, aby potichu odosielalo zmeny na disk
    const originalSaveStateFunc = saveState;
    // (Vložíme volanie do existujúceho ukladania)

    try {
      history.replaceState({
        activeProject: appState.activeProject,
        activeTab: appState.activeTab,
        locationsSubView: appState.locationsSubView,
        modalStack: []
      }, '');
    } catch (e) {}
    renderApp();

    // Pri štarte apky automaticky stiahneme najnovší stav z Google Drivu
    if (localStorage.getItem('google_drive_script_url')) {
      syncDataFromGoogleDrive();
    }
  </script>
<div id="appFloatingTooltip" class="fixed pointer-events-none z-[100] hidden px-3 py-1.5 text-xs font-semibold text-zinc-100 bg-zinc-900/95 dark:bg-zinc-800/95 border border-zinc-700/80 rounded-xl shadow-2xl backdrop-blur-md transition-opacity duration-150 max-w-xs text-center leading-snug"></div>
  <script>
    (function initModernTooltips() {
      const tipBox = document.getElementById('appFloatingTooltip');
      if (!tipBox) return;
      let activeEl = null;

      function hideTooltip() {
        if (activeEl) {
          const stored = activeEl.getAttribute('data-stored-title');
          if (stored) {
            activeEl.setAttribute('title', stored);
            activeEl.removeAttribute('data-stored-title');
          }
          activeEl = null;
        }
        tipBox.classList.add('hidden');
        tipBox.style.opacity = '0';
      }

      document.addEventListener('touchstart', hideTooltip, { passive: true });
      document.addEventListener('scroll', hideTooltip, { passive: true });

      document.addEventListener('mouseover', (e) => {
        if (window.matchMedia('(pointer: coarse)').matches) return;

        const target = e.target.closest('[title]');
        if (!target) return;
        activeEl = target;
        const text = target.getAttribute('title');
        if (!text) return;

        target.setAttribute('data-stored-title', text);
        target.removeAttribute('title');

        tipBox.textContent = text;
        tipBox.classList.remove('hidden');
        tipBox.style.opacity = '1';

        const r = target.getBoundingClientRect();
        const topPos = r.top - tipBox.offsetHeight - 8;
        const leftPos = Math.max(10, Math.min(window.innerWidth - tipBox.offsetWidth - 10, r.left + (r.width / 2) - (tipBox.offsetWidth / 2)));

        tipBox.style.top = (topPos < 10 ? r.bottom + 8 : topPos) + 'px';
        tipBox.style.left = leftPos + 'px';
      });

      document.addEventListener('mouseout', hideTooltip);
    })();
  </script>
